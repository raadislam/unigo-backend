name: UniGo Gemini Production Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/gemini-smoke.trigger'
      - '.github/workflows/gemini-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-backend-gemini-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH with pinned host-key verification
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is missing}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS secret is missing}"
          : "${VPS_HOST:?VPS_HOST secret is missing}"
          : "${VPS_PORT:?VPS_PORT secret is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_deploy
          chmod 600 ~/.ssh/unigo_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/pinned_known_hosts
          chmod 600 ~/.ssh/pinned_known_hosts
          cp ~/.ssh/pinned_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'true'

      - name: Recover Gemini key from previous deployment backup if needed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          SHARED_ENV="/var/www/unigo/backend/shared/.env"
          LEGACY_ENV="$APP_DIR/.env.deployment-backup"
          test -f "$SHARED_ENV"
          if ! grep -Eq '^(export )?GEMINI_API_KEY=' "$SHARED_ENV"; then
            if [ -f "$LEGACY_ENV" ] && grep -Eq '^(export )?GEMINI_API_KEY=' "$LEGACY_ENV"; then
              cp -p "$SHARED_ENV" "$SHARED_ENV.backup-$(date -u +%Y%m%dT%H%M%SZ)"
              grep -E '^(export )?GEMINI_API_KEY=' "$LEGACY_ENV" | tail -n1 >> "$SHARED_ENV"
              chmod 600 "$SHARED_ENV"
              echo "Gemini key restored from pre-deployment environment backup without displaying it."
            else
              echo "Gemini key not found in shared or legacy environment files."
            fi
          else
            echo "Gemini key already present in shared environment."
          fi
          if grep -E '^(export )?GEMINI_MODEL=' "$SHARED_ENV" | grep -E 'gemini-(2\.5|3\.8)-flash' >/dev/null; then
            sed -i -E 's/^(export )?GEMINI_MODEL=.*/GEMINI_MODEL=gemini-3.6-flash/' "$SHARED_ENV"
            echo "Updated retired Gemini model configuration."
          elif ! grep -E '^(export )?GEMINI_MODEL=' "$SHARED_ENV" >/dev/null; then
            printf '\nGEMINI_MODEL=gemini-3.6-flash\n' >> "$SHARED_ENV"
            echo "Set current Gemini model in shared environment."
          fi
          for key in WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET WHATSAPP_WEBHOOK_VERIFY_TOKEN WHATSAPP_GRAPH_API_VERSION WHATSAPP_TIMEOUT; do
            if ! grep -Eq "^(export )?${key}=" "$SHARED_ENV"; then
              if [ -f "$LEGACY_ENV" ]; then
                legacy_line="$(grep -E "^(export )?${key}=" "$LEGACY_ENV" | tail -n1 || true)"
                if [ -n "$legacy_line" ]; then
                  printf '%s\n' "$legacy_line" >> "$SHARED_ENV"
                  echo "Recovered missing $key from previous environment backup."
                fi
              fi
            fi
          done
          cd "$APP_DIR"
          php artisan config:clear
          php artisan config:cache
          php artisan tinker --execute='if ((string)config("services.gemini.api_key","")==="") { echo "Gemini key is absent from Laravel configuration."; exit(1); } echo "Gemini key is loaded in Laravel configuration.";'
          REMOTE

      - name: Check WhatsApp configuration and Meta token without sending
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/unigo/backend/current
          php artisan tinker --execute='$token=(string)config("services.whatsapp.access_token",""); $id=(string)config("services.whatsapp.phone_number_id",""); $version=(string)config("services.whatsapp.graph_api_version","v25.0"); if ($token==="" || $id==="") { echo "WhatsApp access token or phone number ID missing from Laravel config."; exit(1); } $response=\Illuminate\Support\Facades\Http::withToken($token)->timeout(20)->get("https://graph.facebook.com/".$version."/".$id,["fields"=>"id,display_phone_number,verified_name"]); echo "Meta Graph API HTTP=".$response->status()." "; if (!$response->successful()) { $err=$response->json("error",[]); echo "error=".mb_substr((string)($err["message"]??"Unknown error"),0,300)." code=".($err["code"]??"")." subcode=".($err["error_subcode"]??""); exit(1); } echo "WhatsApp phone number resource accessible; ID matched.";
          '
          REMOTE

      - name: Verify Gemini can generate a reply without sending WhatsApp
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GEMINI_SMOKE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" "GEMINI_SMOKE_ID='$GEMINI_SMOKE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/unigo/backend/current
          php artisan tinker --execute='$id=getenv("GEMINI_SMOKE_ID"); $question="Describe UniGo visa consultation services briefly. Smoke test ".$id." test@example.invalid"; $reply=app(\App\Services\WhatsAppService::class)->generateReply($question); $fallback="Thank you for contacting UniGo. We have received your message. Our team will assist you shortly."; if ($reply===$fallback) { echo "WhatsAppService returned fallback; check Gemini logs/config."; exit(1); } echo "WhatsAppService Gemini reply passed; characters=".mb_strlen($reply);'
          REMOTE

      - name: Verify public API
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          req = Request("https://api.unigo-bd.com/api/countries", headers={"Accept": "application/json"})
          with urlopen(req, timeout=45) as response:
              if response.status != 200:
                  raise SystemExit(f"API health check failed: HTTP {response.status}")
              print(f"API health check passed: HTTP {response.status}")
          PY
