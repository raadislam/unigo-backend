name: UniGo Gemini Production Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/gemini-smoke.trigger'
      - '.github/workflows/gemini-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-backend-gemini-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH with pinned host-key verification
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is missing}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS secret is missing}"
          : "${VPS_HOST:?VPS_HOST secret is missing}"
          : "${VPS_PORT:?VPS_PORT secret is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_deploy
          chmod 600 ~/.ssh/unigo_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/pinned_known_hosts
          chmod 600 ~/.ssh/pinned_known_hosts
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/scanned_known_hosts 2>~/.ssh/keyscan.log
          test -s ~/.ssh/scanned_known_hosts
          awk 'NF >= 3 && $1 !~ /^#/ { if ($1 ~ /^@/) print $3 " " $4; else print $2 " " $3 }' ~/.ssh/pinned_known_hosts | sort -u > ~/.ssh/pinned_keys
          awk 'NF >= 3 && $1 !~ /^#/ { print $2 " " $3 }' ~/.ssh/scanned_known_hosts | sort -u > ~/.ssh/scanned_keys
          if ! grep -Fxf ~/.ssh/pinned_keys ~/.ssh/scanned_keys >/dev/null; then
            echo "VPS host-key mismatch. Smoke test stopped."
            exit 1
          fi
          awk 'NR == FNR { pinned[$0] = 1; next } (($2 " " $3) in pinned) { print }' ~/.ssh/pinned_keys ~/.ssh/scanned_known_hosts > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recover Gemini key from previous deployment backup if needed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          SHARED_ENV="/var/www/unigo/backend/shared/.env"
          LEGACY_ENV="$APP_DIR/.env.deployment-backup"
          test -f "$SHARED_ENV"
          if ! grep -Eq '^(export )?GEMINI_API_KEY=' "$SHARED_ENV"; then
            if [ -f "$LEGACY_ENV" ] && grep -Eq '^(export )?GEMINI_API_KEY=' "$LEGACY_ENV"; then
              cp -p "$SHARED_ENV" "$SHARED_ENV.backup-$(date -u +%Y%m%dT%H%M%SZ)"
              grep -E '^(export )?GEMINI_API_KEY=' "$LEGACY_ENV" | tail -n1 >> "$SHARED_ENV"
              chmod 600 "$SHARED_ENV"
              echo "Gemini key restored from pre-deployment environment backup without displaying it."
            else
              echo "Gemini key not found in shared or legacy environment files."
            fi
          else
            echo "Gemini key already present in shared environment."
          fi
          if grep -E '^(export )?GEMINI_MODEL=' "$SHARED_ENV" | grep -F 'gemini-2.5-flash' >/dev/null; then
            sed -i -E 's/^(export )?GEMINI_MODEL=.*/GEMINI_MODEL=gemini-3.8-flash/' "$SHARED_ENV"
            echo "Updated retired Gemini model configuration."
          elif ! grep -E '^(export )?GEMINI_MODEL=' "$SHARED_ENV" >/dev/null; then
            printf '\nGEMINI_MODEL=gemini-3.8-flash\n' >> "$SHARED_ENV"
            echo "Set current Gemini model in shared environment."
          fi
          cd "$APP_DIR"
          php artisan config:clear
          php artisan config:cache
          php artisan tinker --execute='if ((string)config("services.gemini.api_key","")==="") { echo "Gemini key is absent from Laravel configuration."; exit(1); } echo "Gemini key is loaded in Laravel configuration.";'
          REMOTE

      - name: Verify Gemini can generate a reply without sending WhatsApp
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GEMINI_SMOKE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" "GEMINI_SMOKE_ID='$GEMINI_SMOKE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/unigo/backend/current
          php artisan tinker --execute='$model="gemini-3.6-flash"; $key=(string)config("services.gemini.api_key",""); if ($key==="") { echo "GEMINI_API_KEY is missing from production config."; exit(1); } $response=\Illuminate\Support\Facades\Http::withHeaders(["x-goog-api-key"=>$key])->timeout(60)->post("https://generativelanguage.googleapis.com/v1beta/models/".$model.":generateContent",["contents"=>[["role"=>"user","parts"=>[["text"=>"Reply with exactly GEMINI_OK."]]]],"generationConfig"=>["temperature"=>0,"maxOutputTokens"=>32,"thinkingConfig"=>["thinkingLevel"=>"LOW"]]]); echo "Gemini model=".$model." HTTP=".$response->status()." "; if (!$response->successful()) { $message=(string)$response->json("error.message","No error message returned"); echo "API error=".mb_substr($message,0,300); exit(1); } $text=trim((string)$response->json("candidates.0.content.parts.0.text","")); if ($text==="") { echo "Empty model response."; exit(1); } echo "Gemini request successful; response length=".mb_strlen($text);'
          REMOTE

      - name: Verify public API
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          req = Request("https://api.unigo-bd.com/api/countries", headers={"Accept": "application/json"})
          with urlopen(req, timeout=45) as response:
              if response.status != 200:
                  raise SystemExit(f"API health check failed: HTTP {response.status}")
              print(f"API health check passed: HTTP {response.status}")
          PY
