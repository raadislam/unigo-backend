name: Import verified country backlog batches 21, 22 and 23

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/run-verified-country-import-batches-21-23.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the exact 51-country allowlist
        run: |
          set -euo pipefail
          python3 scripts/prepare_verified_country_backlog_batch_21.py
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          expected_44 = {"ID","MU","NP","PH","TR","BN","RW","TZ","HK","MO","UZ","KR","AM","AZ","PK","TL","BB","JM","FJ","KI","NZ","TO","VU","AS","CK","GU","MP","NF","NC","PF","WF","PN","TK","AO","BJ","BW","GM","MZ","NG","AL","IE","MD","ME","RS"}
          expected_4 = {"KY","BM","PA","MX"}
          expected_3 = {"BO","CU","HT"}
          simple21 = list(csv.DictReader(Path("database/data/verified_country_backlog_batch_21.csv").open(encoding="utf-8-sig", newline="")))
          audit21 = list(csv.DictReader(Path("database/data/verified_country_full_audit_batch_21.csv").open(encoding="utf-8-sig", newline="")))
          simple22 = list(csv.DictReader(Path("database/data/new_country_visa_batch_22.csv").open(encoding="utf-8-sig", newline="")))
          audit22 = list(csv.DictReader(Path("database/data/visa_full_audit_batch_22.csv").open(encoding="utf-8-sig", newline="")))
          simple23 = list(csv.DictReader(Path("database/data/new_country_visa_batch_23.csv").open(encoding="utf-8-sig", newline="")))
          audit23 = list(csv.DictReader(Path("database/data/visa_full_audit_batch_23.csv").open(encoding="utf-8-sig", newline="")))
          if len(simple21) != 44 or len(audit21) != 44 or {r["destination_iso2"] for r in audit21} != expected_44:
            raise SystemExit("Batch 21 must contain exactly 44 approved destinations.")
          if len(simple22) != 4 or len(audit22) != 4 or {r["destination_iso2"] for r in audit22} != expected_4:
            raise SystemExit("Batch 22 must contain exactly KY, BM, PA and MX.")
          if (set(expected_44) & set(expected_4)) or (set(expected_44) & set(expected_3)) or (set(expected_4) & set(expected_3)):
            raise SystemExit("Batch allowlists overlap.")
          if len(simple23) != 3 or len(audit23) != 3 or {r["destination_iso2"] for r in audit23} != expected_3:
            raise SystemExit("Batch 23 must contain exactly BO, CU and HT.")
          for batch, simple, audit in (("21", simple21, audit21), ("22", simple22, audit22), ("23", simple23, audit23)):
            if len(simple) != len(audit):
              raise SystemExit(f"Batch {batch}: simple/full-audit row count mismatch.")
            simple_by_code = {r["destination_iso2"]: r for r in simple}
            if len(simple_by_code) != len(simple):
              raise SystemExit(f"Batch {batch}: duplicate simple country key.")
            for row in audit:
              code = row["destination_iso2"]
              if row.get("passport_iso3") != "BGD" or row.get("travel_purpose") != "tourism":
                raise SystemExit(f"{code}: unexpected passport or purpose.")
              if row.get("verification_status") != "verified" or row.get("publish_status") != "published" or row.get("full_audit") != "true":
                raise SystemExit(f"{code}: not explicitly verified and publish-approved.")
              if row.get("official_source_last_checked") != "2026-11-14" or row.get("cross_check_source_last_checked") != "2026-11-14":
                raise SystemExit(f"{code}: source check date mismatch.")
              if not row.get("official_source_url","").startswith("https://") or not row.get("cross_check_source_url","").startswith("https://"):
                raise SystemExit(f"{code}: primary or cross-check URL is not HTTPS.")
              required = ["visa_requirement_type","visa_required","visa_free_eligibility","visa_on_arrival_available","evisa_available","maximum_permitted_stay","entry_count","passport_validity_rule","blank_passport_pages_rule","return_ticket_rule","proof_of_funds_rule","accommodation_rule","travel_insurance_rule","yellow_fever_or_health_rule","transit_rule","application_channel","application_fee","processing_time","required_documents","official_source_url","official_immigration_source_name","cross_check_source_url","cross_check_source_name","review_notes"]
              missing = [field for field in required if not str(row.get(field,"")).strip()]
              if missing:
                raise SystemExit(f"{code}: missing full-audit fields {missing}.")
              if any(row.get(field) not in ("true","false") for field in ["visa_required","visa_free_eligibility","visa_on_arrival_available","evisa_available"]):
                raise SystemExit(f"{code}: invalid boolean field.")
              extra = json.loads(row.get("additional_sources") or "[]")
              if not isinstance(extra,list) or len(extra) < 2:
                raise SystemExit(f"{code}: fewer than two additional sources.")
              for source in extra:
                if source.get("source_type") not in ("official","provider","secondary") or not source.get("source_name") or not source.get("source_url","").startswith("https://"):
                  raise SystemExit(f"{code}: invalid additional source.")
              source_row = simple_by_code.get(code)
              if not source_row:
                raise SystemExit(f"{code}: missing simple seed row.")
              for field in ["passport_iso3","travel_purpose","visa_requirement_type","visa_required","visa_free_eligibility","visa_on_arrival_available","evisa_available","application_fee","processing_time","official_source_url","cross_check_source_url","verification_status"]:
                if source_row.get(field) != row.get(field):
                  raise SystemExit(f"{code}: simple/full-audit mismatch in {field}.")
          simple_all = simple21 + simple22 + simple23
          audit_all = audit21 + audit22 + audit23
          codes = [r["destination_iso2"] for r in audit_all]
          if len(codes) != 51 or len(set(codes)) != 51:
            raise SystemExit("Combined import must contain 51 unique country/nationality/purpose keys.")
          for row in audit_all:
            limits = {"application_fee": 120, "processing_time": 120, "official_immigration_source_name": 180, "cross_check_source_name": 180, "review_notes": 5000, "visa_requirement_type": 255, "entry_count": 40}
            for field, limit in limits.items():
              if len(str(row.get(field, ""))) > limit:
                raise SystemExit(f"{row.get('destination_iso2')}: {field} exceeds importer limit {limit}.")
            for document in filter(None, (item.strip() for item in str(row.get("required_documents", "")).split("|"))):
              if len(document) > 500:
                raise SystemExit(f"{row.get('destination_iso2')}: required document item exceeds 500 characters.")
            for source in json.loads(row.get("additional_sources") or "[]"):
              if len(str(source.get("source_name", ""))) > 180 or len(str(source.get("source_url", ""))) > 2000 or len(str(source.get("verification_notes", ""))) > 5000:
                raise SystemExit(f"{row.get('destination_iso2')}: additional source field exceeds importer limits.")
          with Path("verified_new_country_backlog_batches_21_23.csv").open("w", encoding="utf-8", newline="") as f:
            simple_fields = list(dict.fromkeys(key for row in simple_all for key in row))
            writer = csv.DictWriter(f, fieldnames=simple_fields, extrasaction="raise")
            writer.writeheader()
            writer.writerows(simple_all)
          with Path("verified_full_audit_batches_21_23.csv").open("w", encoding="utf-8", newline="") as f:
            audit_fields = list(dict.fromkeys(key for row in audit_all for key in row))
            writer = csv.DictWriter(f, fieldnames=audit_fields, extrasaction="raise")
            writer.writeheader()
            writer.writerows(audit_all)
          print("VALIDATION_PASSED: 44 verified backlog destinations plus 4 batch 22 destinations and 3 new batch 23 destinations; 51 unique BGD tourism records. Pending rows excluded.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-country-batches-21-23
          path: |
            verified_new_country_backlog_batches_21_23.csv
            verified_full_audit_batches_21_23.csv
            database/data/verified_country_backlog_batch_21.csv
            database/data/verified_country_full_audit_batch_21.csv
            database/data/new_country_visa_batch_22.csv
            database/data/visa_full_audit_batch_22.csv
            database/data/new_country_visa_batch_23.csv
            database/data/visa_full_audit_batch_23.csv

  import-production:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-country-batches-21-23
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_import
          chmod 600 ~/.ssh/unigo_import
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'command -v php && command -v mysql && command -v mysqldump && command -v gzip'
      - name: Upload exact allowlisted data
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p /var/www/unigo/backend/shared/imports'
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" verified_new_country_backlog_batches_21_23.csv verified_full_audit_batches_21_23.csv "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/"
      - name: Export fresh pre-import production audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cd "$APP_DIR"
          php artisan visa:requirements-audit > "$IMPORT_DIR/batches_21_23_pre_import_audit.json"
          test -s "$IMPORT_DIR/batches_21_23_pre_import_audit.json"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batches_21_23_pre_import_audit.json" ./batches_21_23_pre_import_audit.json
      - name: Confirm production country rows and duplicate-free keys
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          expected = {r["destination_iso2"] for r in csv.DictReader(Path("verified_full_audit_batches_21_23.csv").open(encoding="utf-8-sig", newline=""))}
          audit = json.loads(Path("batches_21_23_pre_import_audit.json").read_text())
          countries = audit.get("country_table", [])
          by_iso = {c.get("iso2"): c for c in countries}
          if len(by_iso) != len(countries):
            raise SystemExit("Production country table contains duplicate ISO2 rows.")
          missing = sorted(expected - set(by_iso))
          if missing:
            raise SystemExit(f"Country master rows missing before import: {missing}")
          existing = {}
          for record in audit.get("records", []):
            country = record.get("country") or {}
            code = country.get("iso2")
            if code in expected and record.get("passport_nationality_iso3") == "BGD" and record.get("travel_purpose") == "tourism":
              existing.setdefault(code, []).append(record)
          duplicates = sorted(code for code, items in existing.items() if len(items) > 1)
          if duplicates:
            raise SystemExit(f"Duplicate BGD tourism requirement keys already exist: {duplicates}")
          public_before = {c.get("iso2") for c in audit.get("public_country_directory", [])}
          summary = {
            "total_before": audit.get("total"),
            "published_before": audit.get("published_count"),
            "country_table_count_before": audit.get("country_table_count"),
            "public_directory_count_before": audit.get("public_country_directory_count"),
            "existing_requirement_codes": sorted(existing),
            "existing_published_codes": sorted(code for code, items in existing.items() if items[0].get("is_published") is True),
            "public_directory_codes_before": sorted(x for x in public_before if x),
            "expected_codes": sorted(expected)
          }
          Path("batches_21_23_pre_import_summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          print("PRE_IMPORT_DATABASE_CHECK_PASSED")
          PY
      - name: Create production database backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          SHARED_DIR="/var/www/unigo/backend/shared"
          IMPORT_DIR="$SHARED_DIR/imports"
          BACKUP_DIR="$SHARED_DIR/backups"
          mkdir -p "$BACKUP_DIR"
          test -f "$SHARED_DIR/.env"
          test -f "$APP_DIR/vendor/autoload.php"
          test -s "$IMPORT_DIR/verified_new_country_backlog_batches_21_23.csv"
          test -s "$IMPORT_DIR/verified_full_audit_batches_21_23.csv"
          test -s "$IMPORT_DIR/batches_21_23_pre_import_audit.json"
          CNF="$(mktemp)"
          DB_FILE="$(mktemp)"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-$$"
          BACKUP_FILE="$BACKUP_DIR/unigo-pre-verified-batches-21-23-$STAMP.sql.gz"
          trap 'rm -f "$CNF" "$DB_FILE"' EXIT
          cd "$APP_DIR"
          BACKUP_CNF="$CNF" DB_NAME_FILE="$DB_FILE" UNIGO_APP_DIR="$APP_DIR" php <<'PHP'
          <?php
          $root = getenv('UNIGO_APP_DIR');
          chdir($root);
          require $root . '/vendor/autoload.php';
          $app = require $root . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $connection = config('database.connections.' . config('database.default'));
          if (!is_array($connection) || ($connection['driver'] ?? '') !== 'mysql') { fwrite(STDERR, "Expected MySQL production connection.\n"); exit(1); }
          $database = (string) ($connection['database'] ?? '');
          if ($database === '') { fwrite(STDERR, "Production database name unavailable.\n"); exit(1); }
          $escape = static fn ($value) => '"' . str_replace(["\\", '"', "\n", "\r"], ["\\\\", '\\"', "\n", "\r"], (string) $value) . '"';
          $options = ['host' => $connection['host'] ?? '127.0.0.1', 'port' => $connection['port'] ?? 3306, 'user' => $connection['username'] ?? '', 'password' => $connection['password'] ?? '', 'default-character-set' => $connection['charset'] ?? 'utf8mb4'];
          if (!empty($connection['unix_socket'])) $options['socket'] = $connection['unix_socket'];
          $content = "[client]\n";
          foreach ($options as $key => $value) $content .= $key . '=' . $escape($value) . "\n";
          if (file_put_contents(getenv('BACKUP_CNF'), $content, LOCK_EX) === false || file_put_contents(getenv('DB_NAME_FILE'), $database, LOCK_EX) === false) { fwrite(STDERR, "Unable to prepare protected backup configuration.\n"); exit(1); }
          chmod(getenv('BACKUP_CNF'), 0600);
          chmod(getenv('DB_NAME_FILE'), 0600);
          PHP
          DB_NAME="$(cat "$DB_FILE")"
          mysqldump --defaults-extra-file="$CNF" --no-tablespaces --single-transaction --quick --routines --triggers --events --hex-blob --default-character-set=utf8mb4 "$DB_NAME" | gzip -1 > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          gzip -t "$BACKUP_FILE"
          sha256sum "$BACKUP_FILE" > "$BACKUP_FILE.sha256"
          printf '%s\n' "$BACKUP_FILE" > "$IMPORT_DIR/batches_21_23_backup_path.txt"
          printf '%s\n' "$BACKUP_FILE.sha256" > "$IMPORT_DIR/batches_21_23_backup_checksum_path.txt"
          echo "PRODUCTION_BACKUP_CREATED_AND_GZIP_VERIFIED $BACKUP_FILE"
          REMOTE
      - name: Restore-test production backup in isolated MySQL 8
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          BACKUP_PATH="$(ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cat /var/www/unigo/backend/shared/imports/batches_21_23_backup_path.txt')"
          CHECKSUM_PATH="$(ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cat /var/www/unigo/backend/shared/imports/batches_21_23_backup_checksum_path.txt')"
          test -n "$BACKUP_PATH"
          test -n "$CHECKSUM_PATH"
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$BACKUP_PATH" ./unigo-production-backup.sql.gz
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$CHECKSUM_PATH" ./unigo-production-backup.sql.gz.sha256
          EXPECTED_SHA="$(awk '{print $1}' ./unigo-production-backup.sql.gz.sha256)"
          ACTUAL_SHA="$(sha256sum ./unigo-production-backup.sql.gz | awk '{print $1}')"
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          docker run --name unigo-mysql-restore-test -e MYSQL_ROOT_PASSWORD=unigo_restore_test -d mysql:8.0
          trap 'docker rm -f unigo-mysql-restore-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do docker exec unigo-mysql-restore-test mysql -uroot -punigo_restore_test -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec unigo-mysql-restore-test mysql -uroot -punigo_restore_test -e "CREATE DATABASE unigo_restore_verify"
          gzip -dc ./unigo-production-backup.sql.gz | docker exec -i unigo-mysql-restore-test mysql -uroot -punigo_restore_test unigo_restore_verify
          TABLES="$(docker exec unigo-mysql-restore-test mysql -uroot -punigo_restore_test --batch --skip-column-names unigo_restore_verify -e "SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema='unigo_restore_verify' AND table_type='BASE TABLE'")"
          test -n "$TABLES"
          while IFS= read -r table; do
            count="$(docker exec unigo-mysql-restore-test mysql -uroot -punigo_restore_test --batch --skip-column-names unigo_restore_verify -e "SELECT COUNT(*) FROM \`$table\`")"
            test "$count" -ge 0
          done <<< "$TABLES"
          echo "BACKUP_SHA256_AND_RESTORE_TEST_PASSED_IN_ISOLATED_MYSQL"
      - name: Seed only the approved BGD tourism records and run dry-run
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cd "$APP_DIR"
          mkdir -p storage/app/imports
          cp "$IMPORT_DIR/verified_new_country_backlog_batches_21_23.csv" storage/app/imports/unigo_visa_requirements_research_template.csv
          php artisan db:seed --class=ImportMajorVisaRequirementsSeeder --force
          php artisan visa:requirements-import-research --file="$IMPORT_DIR/verified_full_audit_batches_21_23.csv" --base-url=https://api.unigo-bd.com --dry-run > "$IMPORT_DIR/batches_21_23_dry_run.json"
          test -s "$IMPORT_DIR/batches_21_23_dry_run.json"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batches_21_23_dry_run.json" ./batches_21_23_dry_run.json
      - name: Inspect dry-run result before actual import
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("batches_21_23_dry_run.json").read_text())
          if result.get("mode") != "dry_run" or result.get("rows") != 51 or result.get("failures"):
            raise SystemExit(f"Dry-run did not pass the 51-row allowlist: {result}")
          print(json.dumps(result, indent=2))
          print("DRY_RUN_PASSED_51_ROWS_NO_FAILURES")
          PY
      - name: Import, verify and export post-import database audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cd "$APP_DIR"
          EXPECTED_CSV_SHA="$(sha256sum "$IMPORT_DIR/verified_full_audit_batches_21_23.csv" | awk '{print $1}')"
          STORED_CSV_SHA=""
          if [ -s "$IMPORT_DIR/batches_21_23_import_result.json" ]; then
            STORED_CSV_SHA="$(php -r '$payload=json_decode(file_get_contents($argv[1]), true); echo is_array($payload) ? ($payload["csv_sha256"] ?? "") : "";' "$IMPORT_DIR/batches_21_23_import_result.json")"
          fi
          if [ "$STORED_CSV_SHA" = "$EXPECTED_CSV_SHA" ]; then
            echo "Existing verified import result matches the exact CSV hash; no production write is required."
          else
            php artisan visa:requirements-import-research --file="$IMPORT_DIR/verified_full_audit_batches_21_23.csv" --base-url=https://api.unigo-bd.com > "$IMPORT_DIR/batches_21_23_import_result.json"
          fi
          php artisan visa:requirements-audit > "$IMPORT_DIR/batches_21_23_post_import_audit.json"
          test -s "$IMPORT_DIR/batches_21_23_import_result.json"
          test -s "$IMPORT_DIR/batches_21_23_post_import_audit.json"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batches_21_23_import_result.json" ./batches_21_23_import_result.json
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batches_21_23_post_import_audit.json" ./batches_21_23_post_import_audit.json
      - name: Verify database readback and public API for all 51 countries
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          expected_rows = {r["destination_iso2"]: r for r in csv.DictReader(Path("verified_full_audit_batches_21_23.csv").open(encoding="utf-8-sig", newline=""))}
          pre = json.loads(Path("batches_21_23_pre_import_audit.json").read_text())
          post = json.loads(Path("batches_21_23_post_import_audit.json").read_text())
          imported = json.loads(Path("batches_21_23_import_result.json").read_text())
          pre_summary = json.loads(Path("batches_21_23_pre_import_summary.json").read_text())
          if imported.get("mode") != "import" or imported.get("rows") != 51 or imported.get("failures") or imported.get("read_back") != 51 or imported.get("reverified") != 51 or imported.get("republished") != 51:
            raise SystemExit(f"Importer readback did not confirm all 51 records: {imported}")
          if post.get("country_table_count") != pre.get("country_table_count"):
            raise SystemExit("Country master row count changed during a visa-requirement-only import.")
          expected_total = int(pre.get("total",0)) + len(set(expected_rows) - set(pre_summary["existing_requirement_codes"]))
          if post.get("total") != expected_total:
            raise SystemExit(f"Database requirement count mismatch: expected {expected_total}, got {post.get('total')}")
          records = post.get("records", [])
          keys = [(r.get("country",{}).get("iso2"),r.get("passport_nationality_iso3"),r.get("travel_purpose")) for r in records]
          if len(keys) != len(set(keys)):
            raise SystemExit("Database contains duplicate country/passport/purpose requirement keys.")
          by_iso = {}
          for record in records:
            country = record.get("country") or {}
            if country.get("iso2") in expected_rows and record.get("passport_nationality_iso3") == "BGD" and record.get("travel_purpose") == "tourism":
              by_iso.setdefault(country["iso2"], []).append(record)
          if set(by_iso) != set(expected_rows) or any(len(items) != 1 for items in by_iso.values()):
            raise SystemExit(f"Database readback country set mismatch: {sorted(by_iso)}")
          for code, source_row in expected_rows.items():
            record = by_iso[code][0]
            if record.get("verification_status") != "verified" or record.get("is_published") is not True:
              raise SystemExit(f"{code}: database record is not verified and published.")
            if record.get("application_fee") != source_row.get("application_fee") or record.get("processing_time") != source_row.get("processing_time"):
              raise SystemExit(f"{code}: fee or processing-time database readback mismatch.")
            urls = {s.get("source_url") for s in record.get("sources",[])}
            if source_row.get("official_source_url") not in urls or source_row.get("cross_check_source_url") not in urls:
              raise SystemExit(f"{code}: primary or cross-check source missing from database.")
            extra = json.loads(source_row.get("additional_sources") or "[]")
            if any(s.get("source_url") not in urls for s in extra):
              raise SystemExit(f"{code}: one or more additional sources missing from database.")
            if not any(s.get("source_type") == "official" and s.get("is_primary") is True for s in record.get("sources",[])):
              raise SystemExit(f"{code}: primary official source flag missing.")
          public_before = set(pre_summary["public_directory_codes_before"])
          public_after = {c.get("iso2") for c in post.get("public_country_directory",[]) if c.get("iso2")}
          expected_public = public_before | set(expected_rows)
          if public_after != expected_public:
            raise SystemExit(f"Public country-directory audit mismatch: expected {len(expected_public)}, got {len(public_after)}.")
          if post.get("public_country_directory_count") != len(expected_public):
            raise SystemExit("Post-import public directory count does not match its slug set.")

          base="https://api.unigo-bd.com/api"
          def get(path):
            req=Request(base+path,headers={"Accept":"application/json","User-Agent":"UniGo-Verified-Batches-21-23/1.0"})
            with urlopen(req,timeout=45) as response:
              if response.status != 200:
                raise SystemExit(f"Public API HTTP {response.status}: {path}")
              return json.loads(response.read().decode("utf-8"))

          directory=get("/countries")
          directory_rows=directory.get("data")
          if directory.get("success") is not True or not isinstance(directory_rows,list):
            raise SystemExit("Public country directory API response is invalid.")
          directory_by_slug={c.get("slug"):c for c in directory_rows}
          if len(directory_by_slug) != len(directory_rows) or len(directory_rows) != len(expected_public):
            raise SystemExit("Public country directory API count or slug uniqueness mismatch.")
          requirements_payload=get("/visa-requirements?passport=BGD&purpose=tourism")
          requirements=requirements_payload.get("data")
          if requirements_payload.get("success") is not True or not isinstance(requirements,list):
            raise SystemExit("Public BGD tourism requirement API response is invalid.")
          requirement_by_slug={r.get("country",{}).get("slug"):r for r in requirements if (r.get("country") or {}).get("slug")}
          if len(requirement_by_slug) != len(requirements):
            raise SystemExit("Public BGD tourism requirement API contains duplicate or empty country slugs.")
          if set(requirement_by_slug) != {c.get("slug") for c in post.get("public_country_directory",[])}:
            raise SystemExit("Public requirement and country-directory slug sets do not match.")
          country_by_iso={c.get("iso2"):c for c in post.get("country_table",[])}
          for code, row in expected_rows.items():
            country=country_by_iso.get(code)
            if not country or not country.get("slug"):
              raise SystemExit(f"{code}: production country slug missing.")
            slug=country["slug"]
            record=requirement_by_slug.get(slug)
            if not record or record.get("verification_status")!="verified" or record.get("is_published") is not True:
              raise SystemExit(f"{code}: public listing does not expose a verified published record.")
            if record.get("passport_nationality_iso3")!="BGD" or record.get("travel_purpose")!="tourism":
              raise SystemExit(f"{code}: public listing passport or purpose mismatch.")
            if record.get("application_fee") != row.get("application_fee") or record.get("processing_time") != row.get("processing_time"):
              raise SystemExit(f"{code}: public listing field mismatch.")
            primary=row.get("official_source_url")
            if not any(s.get("source_type")=="official" and s.get("is_primary") is True and s.get("source_url")==primary for s in record.get("sources",[])):
              raise SystemExit(f"{code}: public listing lacks the primary official source.")
            detail=get(f"/visa-requirements/{code}?passport=BGD&purpose=tourism")
            d=detail.get("data")
            if detail.get("success") is not True or not isinstance(d,dict) or d.get("id")!=record.get("id") or d.get("verification_status")!="verified" or d.get("is_published") is not True:
              raise SystemExit(f"{code}: public detail API mismatch.")
            detail_urls={s.get("source_url") for s in d.get("sources",[])}
            extra_sources = json.loads(row.get("additional_sources") or "[]")
            required_urls = {row.get("official_source_url")}
            cross_url = row.get("cross_check_source_url")
            if cross_url and "vfsglobal.com" not in cross_url.lower():
              required_urls.add(cross_url)
            required_urls |= {s.get("source_url") for s in extra_sources if s.get("source_type") == "official"}
            if not required_urls.issubset(detail_urls):
              raise SystemExit(f"{code}: public detail API is missing source URLs.")
            print(f"PUBLIC_API_VERIFIED {country['name']} ({code}) — {slug}")
          print(f"DATABASE_AUDIT_VERIFIED total={post.get('total')} published={post.get('published_count')} country_rows={post.get('country_table_count')} public_directory={post.get('public_country_directory_count')}")
          print(f"PUBLIC_API_VERIFIED countries={len(directory_rows)} requirements={len(requirements)}")
          print("ALL_51_COUNTRIES_IMPORTED_VERIFIED_PUBLISHED")
          PY
