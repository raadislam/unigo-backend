name: Deploy UniGo Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'database/data/vfs_bangladesh_destination_coverage.csv'
      - 'database/data/vfs_fee_processing_snapshot_20261114.csv'
      - 'database/data/country_discovery_ledger.csv'
      - 'database/data/new_country_visa_batch_09.csv'
      - 'database/data/visa_full_audit_batch_09.csv'
      - 'database/seeders/ImportMajorVisaRequirementsSeeder.php'
      - 'scripts/validate_visa_batches.py'
      - 'scripts/preflight_visa_import.php'
      - 'scripts/verify_visa_import_audit.php'
      - 'scripts/dispatch_frontend_rebuild.py'
      - 'docs/visa-discovery-batch-09-release-checklist.md'
      - '.github/workflows/validate-visa-batches.yml'
      - 'scripts/validate_vfs_coverage.py'
      - '.github/workflows/validate-vfs-coverage.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: unigo-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate visa research batches
        run: python3 scripts/validate_visa_batches.py

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_deploy
          chmod 600 ~/.ssh/unigo_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Check deployment tools
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'command -v rsync && command -v composer && command -v php'

      - name: Sync application files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/unigo_deploy -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/current/"

      - name: Install dependencies and refresh Laravel caches
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e

          APP_DIR="/var/www/unigo/backend/current"
          SHARED_DIR="/var/www/unigo/backend/shared"

          test -f "$SHARED_DIR/.env"
          test -d "$SHARED_DIR/storage"

          if [ -L "$APP_DIR/.env" ]; then
            rm "$APP_DIR/.env"
          elif [ -e "$APP_DIR/.env" ]; then
            mv "$APP_DIR/.env" "$APP_DIR/.env.deployment-backup"
          fi
          ln -s "$SHARED_DIR/.env" "$APP_DIR/.env"

          if [ -L "$APP_DIR/storage" ]; then
            rm "$APP_DIR/storage"
          elif [ -d "$APP_DIR/storage" ]; then
            if find "$APP_DIR/storage" -mindepth 1 -print -quit | grep -q .; then
              rsync -a "$APP_DIR/storage/" "$SHARED_DIR/storage/"
            fi
            rm -rf "$APP_DIR/storage"
          fi
          ln -s "$SHARED_DIR/storage" "$APP_DIR/storage"

          mkdir -p "$SHARED_DIR/storage/framework/cache/data"
          mkdir -p "$SHARED_DIR/storage/framework/sessions"
          mkdir -p "$SHARED_DIR/storage/framework/views"
          mkdir -p "$SHARED_DIR/storage/logs"

          cd "$APP_DIR"

          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

          php artisan config:clear
          php artisan route:clear
          php artisan config:cache

          if [ -d "$APP_DIR/resources/views" ]; then
            php artisan view:clear
            php artisan view:cache
          fi
          REMOTE

      - name: Export read-only visa database audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php artisan visa:requirements-audit'

      - name: Validate official fee and processing-time batch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_fee_processing_batch_01.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_fee_processing_batch_01.csv --base-url=https://api.unigo-bd.com --dry-run; else echo "No pending visa research CSV."; fi'

      - name: Import official fee and processing-time batch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_fee_processing_batch_01.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_fee_processing_batch_01.csv --base-url=https://api.unigo-bd.com; else echo "No pending visa research CSV."; fi'

      - name: Validate full audit batch 02 for Japan and Australia
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_02.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_02.csv --base-url=https://api.unigo-bd.com --dry-run; else echo "No pending full-audit batch."; fi'

      - name: Import full audit batch 02 for Japan and Australia
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_02.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_02.csv --base-url=https://api.unigo-bd.com; else echo "No pending full-audit batch."; fi'

      - name: Seed newly researched country records
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/new_country_visa_batch.csv ]; then mkdir -p storage/app/imports && cp database/data/new_country_visa_batch.csv storage/app/imports/unigo_visa_requirements_research_template.csv && php artisan db:seed --class=ImportMajorVisaRequirementsSeeder --force; else echo "No new-country seed batch."; fi'

      - name: Validate new-country full audit batch 03
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_03.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_03.csv --base-url=https://api.unigo-bd.com --dry-run; else echo "No new-country full-audit batch."; fi'

      - name: Import and publish new-country full audit batch 03
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_03.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_03.csv --base-url=https://api.unigo-bd.com; else echo "No new-country full-audit batch."; fi'

      - name: Validate Schengen full audit batch 04
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_04.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_04.csv --base-url=https://api.unigo-bd.com --dry-run; else echo "No Schengen full-audit batch."; fi'

      - name: Import and publish Schengen full audit batch 04
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_04.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_04.csv --base-url=https://api.unigo-bd.com; else echo "No Schengen full-audit batch."; fi'

      - name: Validate remaining-country full audit batch 05
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_05.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_05.csv --base-url=https://api.unigo-bd.com --dry-run; else echo "No remaining-country full-audit batch."; fi'

      - name: Import and publish remaining-country full audit batch 05
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && if [ -f database/data/visa_full_audit_batch_05.csv ]; then php artisan visa:requirements-import-research --file=database/data/visa_full_audit_batch_05.csv --base-url=https://api.unigo-bd.com; else echo "No remaining-country full-audit batch."; fi'

      - name: Check backup, import markers and frontend dispatch before new-country batch
        id: new_country_import_gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BACKUP_VERIFIED: ${{ vars.UNIGO_VISA_IMPORT_BACKUP_VERIFIED }}
          BACKUP_PATH: ${{ vars.UNIGO_VISA_IMPORT_BACKUP_PATH }}
          BACKUP_SHA256: ${{ vars.UNIGO_VISA_IMPORT_BACKUP_SHA256 }}
          FRONTEND_TOKEN: ${{ secrets.UNIGO_FRONTEND_DISPATCH_TOKEN }}
        run: |
          set -e
          mapfile -t hashes < <(sha256sum database/data/visa_full_audit_batch_06.csv database/data/visa_full_audit_batch_07.csv database/data/visa_full_audit_batch_08.csv database/data/visa_full_audit_batch_09.csv | awk '{print $1}')
          combined_hash=$(printf '%s\n' "${hashes[@]}" | sha256sum | awk '{print $1}')
          marker_count=0
          for hash in "${hashes[@]}"; do
            if ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f /var/www/unigo/backend/current/storage/logs/visa-imports-$hash.json"; then
              marker_count=$((marker_count + 1))
            fi
          done
          if [ "$marker_count" -eq 4 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "expected_public_count=53" >> "$GITHUB_OUTPUT"
            if ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f /var/www/unigo/backend/current/storage/logs/visa-frontend-verified-$combined_hash.json"; then
              echo "frontend_pending=false" >> "$GITHUB_OUTPUT"
            else
              if [ -z "$FRONTEND_TOKEN" ]; then
                echo "::error::The new-country records are imported but the frontend verification marker is missing and UNIGO_FRONTEND_DISPATCH_TOKEN is not configured."
                exit 1
              fi
              echo "frontend_pending=true" >> "$GITHUB_OUTPUT"
            fi
            echo "All four import markers exist; data import is skipped."
            exit 0
          fi
          if [ "$marker_count" -ne 0 ]; then
            echo "::error::Only some new-country batch markers exist. Manual reconciliation is required; no batch will be overwritten."
            exit 1
          fi
          if [ "$BACKUP_VERIFIED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "frontend_pending=false" >> "$GITHUB_OUTPUT"
            echo "expected_public_count=41" >> "$GITHUB_OUTPUT"
            echo "::warning::New-country import skipped: set UNIGO_VISA_IMPORT_BACKUP_VERIFIED=true only after a restorable backup has been restore-tested."
            exit 0
          fi
          case "$BACKUP_PATH" in
            /var/backups/unigo/*.sql|/var/backups/unigo/*.sql.gz) ;;
            *) echo "::error::UNIGO_VISA_IMPORT_BACKUP_PATH must be a .sql or .sql.gz file under /var/backups/unigo/."; exit 1 ;;
          esac
          if ! [[ "$BACKUP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::UNIGO_VISA_IMPORT_BACKUP_SHA256 must contain 64 hexadecimal characters."
            exit 1
          fi
          if [ -z "$FRONTEND_TOKEN" ]; then
            echo "::error::UNIGO_FRONTEND_DISPATCH_TOKEN is required before importing new country records."
            exit 1
          fi
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -s '$BACKUP_PATH' && actual=\$(sha256sum '$BACKUP_PATH' | cut -d' ' -f1) && test \"\$actual\" = '$BACKUP_SHA256' && case '$BACKUP_PATH' in *.gz) gzip -t '$BACKUP_PATH';; esac"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "imported=true" >> "$GITHUB_OUTPUT"
          echo "frontend_pending=true" >> "$GITHUB_OUTPUT"
          echo "expected_public_count=53" >> "$GITHUB_OUTPUT"

      - name: Inspect migration status and export fresh pre-import audit
        if: steps.new_country_import_gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/unigo/backend/current
          php artisan migrate:status --no-ansi > /tmp/unigo-migration-status.txt
          if grep -Eq '(^|[[:space:]])Pending([[:space:]]|$)' /tmp/unigo-migration-status.txt; then
            cat /tmp/unigo-migration-status.txt
            echo "Pending migrations detected; no visa data import will run."
            exit 1
          fi
          php artisan visa:requirements-audit > /tmp/unigo-visa-preflight.json
          php scripts/preflight_visa_import.php /tmp/unigo-visa-preflight.json 41 41 249 "ID,MU,NP,PH,LK,TR,BN,RW,TZ,BT,HK,MO,KZ,UZ,KR,QA,SA,JO"
          REMOTE

      - name: Dry-run new-country seed batches 06-07, 08 and 09
        if: steps.new_country_import_gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/unigo/backend/current
          for file in database/data/new_country_visa_batch_06_07.csv database/data/new_country_visa_batch_08.csv database/data/new_country_visa_batch_09.csv; do
            cp "$file" storage/app/imports/unigo_visa_requirements_research_template.csv
            UNIGO_VISA_SEED_DRY_RUN=true php artisan db:seed --class=ImportMajorVisaRequirementsSeeder --force
          done
          REMOTE

      - name: Import new-country seed batches 06-07, 08 and 09 as unpublished records
        if: steps.new_country_import_gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/unigo/backend/current
          for file in database/data/new_country_visa_batch_06_07.csv database/data/new_country_visa_batch_08.csv database/data/new_country_visa_batch_09.csv; do
            cp "$file" storage/app/imports/unigo_visa_requirements_research_template.csv
            php artisan db:seed --class=ImportMajorVisaRequirementsSeeder --force
          done
          REMOTE

      - name: Dry-run full audit batches 06-09
        if: steps.new_country_import_gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/unigo/backend/current
          for file in database/data/visa_full_audit_batch_06.csv database/data/visa_full_audit_batch_07.csv database/data/visa_full_audit_batch_08.csv database/data/visa_full_audit_batch_09.csv; do
            php artisan visa:requirements-import-research --file="$file" --base-url=https://api.unigo-bd.com --dry-run
          done
          REMOTE

      - name: Import and verify full audit batches 06-09
        if: steps.new_country_import_gate.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/unigo/backend/current
          for file in database/data/visa_full_audit_batch_06.csv database/data/visa_full_audit_batch_07.csv database/data/visa_full_audit_batch_08.csv database/data/visa_full_audit_batch_09.csv; do
            php artisan visa:requirements-import-research --file="$file" --base-url=https://api.unigo-bd.com
          done
          REMOTE


      - name: Verify imported visa records by readback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php artisan visa:requirements-audit'

      - name: Verify new-country database readback and official sources
        if: steps.new_country_import_gate.outputs.expected_public_count == '53'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/unigo/backend/current
          php artisan visa:requirements-audit > /tmp/unigo-visa-postflight.json
          php scripts/verify_visa_import_audit.php /tmp/unigo-visa-postflight.json
          REMOTE
      - name: Verify public country directory and visa requirement API
        env:
          EXPECTED_PUBLIC_COUNT: ${{ steps.new_country_import_gate.outputs.expected_public_count || '41' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = "https://api.unigo-bd.com/api"

          def get_json(path):
              request = Request(base + path, headers={"Accept": "application/json", "User-Agent": "UniGo-Public-API-Check/1.0"})
              with urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"Public API returned HTTP {response.status}: {path}")
                  payload = json.loads(response.read().decode("utf-8"))
              return payload

          directory = get_json("/countries")
          if directory.get("success") is not True or not isinstance(directory.get("data"), list):
              raise SystemExit("Public country directory API returned an unsuccessful or invalid response.")

          requirements_payload = get_json("/visa-requirements?passport=BGD&purpose=tourism")
          if requirements_payload.get("success") is not True or not isinstance(requirements_payload.get("data"), list):
              raise SystemExit("Public BGD tourism visa requirement API returned an invalid response.")

          countries = directory["data"]
          requirements = requirements_payload["data"]
          expected_count = int(os.environ.get("EXPECTED_PUBLIC_COUNT", "41"))
          if len(countries) != expected_count or len(requirements) != expected_count:
              raise SystemExit(f"Public API count mismatch: expected {expected_count}, countries={len(countries)}, requirements={len(requirements)}.")
          country_by_slug = {item.get("slug"): item for item in countries}
          requirement_by_slug = {
              item.get("country", {}).get("slug"): item
              for item in requirements
              if item.get("country", {}).get("slug")
          }

          if len(country_by_slug) != len(countries):
              raise SystemExit("Public country directory contains duplicate or empty slugs.")

          for country in countries:
              slug = country.get("slug")
              if not country.get("is_published", False) and slug not in requirement_by_slug:
                  raise SystemExit(f"Country {slug} is included without a published BGD tourism requirement or country publication flag.")

          for slug, requirement in requirement_by_slug.items():
              if slug not in country_by_slug:
                  raise SystemExit(f"Published BGD tourism requirement {slug} is missing from the public country directory.")
              if requirement.get("passport_nationality_iso3") != "BGD" or requirement.get("travel_purpose") != "tourism":
                  raise SystemExit(f"Public requirement {slug} has an unexpected passport or travel purpose.")
              if requirement.get("verification_status") != "verified" or requirement.get("is_published") is not True:
                  raise SystemExit(f"Public requirement {slug} is not verified and published.")
              if not any(source.get("source_type") == "official" and source.get("is_primary") is True for source in requirement.get("sources", [])):
                  raise SystemExit(f"Public requirement {slug} is missing a primary official source.")

              iso2 = (requirement.get("country") or {}).get("iso2")
              if not iso2:
                  raise SystemExit(f"Public requirement {slug} is missing its destination ISO2.")
              detail_path = f"/visa-requirements/{iso2}?passport=BGD&purpose=tourism"
              detail_payload = get_json(detail_path)
              detail = detail_payload.get("data")
              if detail_payload.get("success") is not True or not isinstance(detail, dict):
                  raise SystemExit(f"Public visa detail API returned an invalid record for {slug}.")
              if (
                  detail.get("id") != requirement.get("id")
                  or detail.get("passport_nationality_iso3") != "BGD"
                  or detail.get("travel_purpose") != "tourism"
                  or detail.get("verification_status") != "verified"
                  or detail.get("is_published") is not True
                  or (detail.get("country") or {}).get("slug") != slug
              ):
                  raise SystemExit(f"Public visa detail API does not match the published list record for {slug}.")
              list_sources = {
                  source.get("source_url")
                  for source in requirement.get("sources", [])
                  if source.get("source_type") == "official" and source.get("source_url")
              }
              detail_sources = {
                  source.get("source_url")
                  for source in detail.get("sources", [])
                  if source.get("source_type") == "official" and source.get("source_url")
              }
              if not list_sources.issubset(detail_sources):
                  raise SystemExit(f"Public visa detail API is missing official source links for {slug}.")
              print(f"Public visa detail API HTTP 200 verified: {slug} ({iso2}).")

          for slug in ("japan", "australia", "maldives", "viet-nam"):
              country = country_by_slug.get(slug)
              requirement = requirement_by_slug.get(slug)
              if not country or not requirement:
                  raise SystemExit(f"Mandatory country or BGD tourism requirement is missing: {slug}.")
              if slug in ("japan", "australia") and country.get("is_published") is not False:
                  raise SystemExit(f"Expected {slug} to remain admitted by its visa requirement rather than a blanket country flag.")
              print(f"Verified regression destination: {slug}; requirement.verification_status=verified; requirement.is_published=true.")

          if expected_count == 53:
              expected_new_slugs = {"indonesia", "mauritius", "nepal", "philippines", "turkiye", "brunei", "rwanda", "tanzania", "hong-kong", "macao", "uzbekistan", "korea-republic-of"}
              missing_new = sorted(expected_new_slugs - set(requirement_by_slug))
              if missing_new:
                  raise SystemExit(f"New verified country requirements are missing from the public API: {missing_new}")
              pending_slugs = {"sri-lanka", "bhutan", "kazakhstan", "qatar", "saudi-arabia", "jordan"}
              leaked_pending = sorted(pending_slugs & set(requirement_by_slug))
              if leaked_pending:
                  raise SystemExit(f"Pending country requirements leaked into the public API: {leaked_pending}")

          print(f"Public country directory HTTP 200: {len(countries)} countries.")
          print("Directory slugs: " + ", ".join(sorted(country_by_slug)))
          print(f"Public BGD tourism requirements HTTP 200: {len(requirements)} records.")
          print("All country visibility gates and official-source checks passed.")
          PY

      - name: Rebuild and verify static frontend after new-country publication
        if: steps.new_country_import_gate.outputs.frontend_pending == 'true'
        env:
          UNIGO_FRONTEND_DISPATCH_TOKEN: ${{ secrets.UNIGO_FRONTEND_DISPATCH_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          python3 scripts/dispatch_frontend_rebuild.py
          combined_hash=$(printf '%s\n' $(sha256sum database/data/visa_full_audit_batch_06.csv database/data/visa_full_audit_batch_07.csv database/data/visa_full_audit_batch_08.csv database/data/visa_full_audit_batch_09.csv | awk '{print $1}') | sha256sum | awk '{print $1}')
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "printf '%s\n' 'verified' > /var/www/unigo/backend/current/storage/logs/visa-frontend-verified-$combined_hash.json"
