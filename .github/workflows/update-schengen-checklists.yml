name: Update Schengen Bangladesh Checklists

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm the restore-tested production checklist update
        required: true
        type: choice
        options:
          - review-only
          - apply

permissions:
  contents: read

concurrency:
  group: unigo-schengen-checklist-production
  cancel-in-progress: false

jobs:
  update:
    if: inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is missing}"
          : "${VPS_HOST:?VPS_HOST secret is missing}"
          : "${VPS_PORT:?VPS_PORT secret is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_deploy
          chmod 600 ~/.ssh/unigo_deploy
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>~/.ssh/keyscan.log; then
              if [ -s ~/.ssh/known_hosts ]; then
                exit 0
              fi
            fi
            echo "SSH host-key scan attempt $attempt failed."
            cat ~/.ssh/keyscan.log
            sleep 5
          done
          exit 1

      - name: Create production preflight and database backup
        id: backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > backup-meta.json <<'REMOTE'
          set -euo pipefail
          APP=/var/www/unigo/backend/current
          cd "$APP"
          test -f /var/www/unigo/backend/shared/.env
          test -f database/seeders/SchengenBangladeshChecklistSupplementSeeder.php
          command -v mysqldump >/dev/null
          command -v gzip >/dev/null
          php artisan migrate:status --no-ansi > /tmp/schengen-migrations.txt
          if grep -q "Pending" /tmp/schengen-migrations.txt; then
            echo "Pending production migrations detected; refusing checklist update."
            exit 1
          fi
          php artisan visa:requirements-audit > /tmp/schengen-audit-before.txt
          cat > /tmp/schengen-preflight.php <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $countryCount = \App\Models\Country::query()->count();
          $records = \App\Models\VisaRequirement::query()
              ->where('passport_nationality_iso3', 'BGD')
              ->where('travel_purpose', 'tourism')
              ->get();
          $published = $records->filter(fn ($row) => $row->verification_status === 'verified' && (bool) $row->is_published)->count();
          $pending = $records->count() - $published;
          $duplicates = \Illuminate\Support\Facades\DB::table('visa_requirements')
              ->where('passport_nationality_iso3', 'BGD')
              ->where('travel_purpose', 'tourism')
              ->select('country_id', 'passport_nationality_iso3', 'travel_purpose')
              ->groupBy('country_id', 'passport_nationality_iso3', 'travel_purpose')
              ->havingRaw('COUNT(*) > 1')
              ->count();
          $result = [
              'country_count' => $countryCount,
              'requirement_count' => $records->count(),
              'source_count' => \Illuminate\Support\Facades\DB::table('visa_requirement_sources')->count(),
              'published_count' => $published,
              'pending_count' => $pending,
              'duplicate_keys' => $duplicates,
          ];
          if ($countryCount < 250 || $duplicates !== 0) {
              fwrite(STDERR, json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
              exit(1);
          }
          echo json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES);
          PHP
          php -l /tmp/schengen-preflight.php >/dev/null
          php /tmp/schengen-preflight.php > /tmp/schengen-preflight.json
          cat > /tmp/schengen-backup.php <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $connectionName = config('database.default');
          $db = config('database.connections.' . $connectionName);
          if (! $db || empty($db['database']) || empty($db['username'])) {
              throw new RuntimeException('Configured production database connection is incomplete.');
          }
          $quote = fn ($value) => '"' . str_replace(["\\", '"'], ["\\\\", '\\"'], (string) $value) . '"';
          $cnf = '/tmp/unigo-schengen-mysql.cnf';
          $content = "[client]\n";
          $content .= 'host=' . $quote($db['host'] ?? '127.0.0.1') . "\n";
          $content .= 'user=' . $quote($db['username']) . "\n";
          $content .= 'password=' . $quote($db['password'] ?? '') . "\n";
          $content .= 'port=' . $quote($db['port'] ?? 3306) . "\n";
          if (! empty($db['unix_socket'])) $content .= 'socket=' . $quote($db['unix_socket']) . "\n";
          file_put_contents($cnf, $content, LOCK_EX);
          chmod($cnf, 0600);
          $directory = '/var/www/unigo/backend/shared/backups';
          if (! is_dir($directory) && ! mkdir($directory, 0750, true) && ! is_dir($directory)) {
              throw new RuntimeException('Unable to create the shared backup directory.');
          }
          $path = $directory . '/unigo-schengen-checklists-preupdate-' . gmdate('Ymd\\THis\\Z') . '.sql.gz';
          $command = 'bash -o pipefail -c ' . escapeshellarg(
              'mysqldump --defaults-extra-file=' . escapeshellarg($cnf) .
              ' --single-transaction --routines --triggers --no-tablespaces --default-character-set=utf8mb4 ' .
              escapeshellarg($db['database']) . ' | gzip -c > ' . escapeshellarg($path)
          );
          exec($command, $output, $status);
          @unlink($cnf);
          if ($status !== 0 || ! is_file($path) || filesize($path) < 1024) {
              throw new RuntimeException('Production database backup creation failed.');
          }
          exec('gzip -t ' . escapeshellarg($path), $gzipOutput, $gzipStatus);
          if ($gzipStatus !== 0) throw new RuntimeException('Production backup gzip integrity check failed.');
          $preflight = json_decode(file_get_contents('/tmp/schengen-preflight.json'), true);
          if (! is_array($preflight)) throw new RuntimeException('Production preflight JSON is missing.');
          $meta = [
              'preflight' => $preflight,
              'backup_path' => $path,
              'sha256' => hash_file('sha256', $path),
              'size_bytes' => filesize($path),
              'database_name' => $db['database'],
              'created_at_utc' => gmdate(DATE_ATOM),
          ];
          echo json_encode($meta, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES);
          @unlink('/tmp/schengen-preflight.php');
          @unlink('/tmp/schengen-backup.php');
          PHP
          php -l /tmp/schengen-backup.php >/dev/null
          php /tmp/schengen-backup.php
          REMOTE
          python3 -m json.tool backup-meta.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("backup-meta.json").read_text())
          with open(Path.home() / ".schengen-backup-meta", "w") as handle:
              handle.write(data["backup_path"] + "\n" + data["sha256"] + "\n" + data["database_name"] + "\n")
          print("PRODUCTION_BACKUP_CREATED", data["backup_path"])
          print("PRODUCTION_BACKUP_SHA256", data["sha256"])
          print("PRODUCTION_BACKUP_SIZE_BYTES", data["size_bytes"])
          PY
          BACKUP_PATH="$(sed -n '1p' ~/.schengen-backup-meta)"
          BACKUP_SHA="$(sed -n '2p' ~/.schengen-backup-meta)"
          scp -i ~/.ssh/unigo_deploy -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$BACKUP_PATH" production-backup.sql.gz
          echo "$BACKUP_SHA  production-backup.sql.gz" | sha256sum -c -
          gzip -t production-backup.sql.gz
          echo "database_name=$(sed -n '3p' ~/.schengen-backup-meta)" >> "$GITHUB_OUTPUT"

      - name: Restore-test production backup in isolated MySQL 8
        id: restore
        env:
          DB_NAME: ${{ steps.backup.outputs.database_name }}
        run: |
          set -euo pipefail
          RESTORE_DB_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$RESTORE_DB_PASSWORD"
          docker run -d --name unigo-schengen-restore -e MYSQL_ROOT_PASSWORD="$RESTORE_DB_PASSWORD" -e MYSQL_DATABASE="$DB_NAME" -p 3307:3306 mysql:8.0
          trap 'docker rm -f unigo-schengen-restore >/dev/null 2>&1 || true' EXIT
          AUTH_READY=false
          for attempt in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$RESTORE_DB_PASSWORD" unigo-schengen-restore mysql -uroot -N -B -e "SELECT 1" >/dev/null 2>&1; then
              AUTH_READY=true
              break
            fi
            sleep 2
          done
          if [ "$AUTH_READY" != "true" ]; then
            docker logs --tail 80 unigo-schengen-restore || true
            echo "Isolated MySQL did not become ready for authenticated queries."
            exit 1
          fi
          docker exec -e MYSQL_PWD="$RESTORE_DB_PASSWORD" unigo-schengen-restore mysql -uroot -N -B -e "SELECT 1" | grep -qx "1"
          echo "ISOLATED_MYSQL_AUTHENTICATED_READY"
          gzip -dc production-backup.sql.gz | docker exec -i -e MYSQL_PWD="$RESTORE_DB_PASSWORD" unigo-schengen-restore mysql -uroot "$DB_NAME"
          RESTORE_COUNTS="$(docker exec -e MYSQL_PWD="$RESTORE_DB_PASSWORD" unigo-schengen-restore mysql -uroot -N -B "$DB_NAME" -e "SELECT (SELECT COUNT(*) FROM countries),(SELECT COUNT(*) FROM visa_requirements),(SELECT COUNT(*) FROM visa_requirement_sources),(SELECT COUNT(*) FROM visa_requirements WHERE passport_nationality_iso3='BGD' AND travel_purpose='tourism' AND verification_status='verified' AND is_published=1),(SELECT COUNT(*) FROM visa_requirements WHERE passport_nationality_iso3='BGD' AND travel_purpose='tourism' AND NOT (verification_status='verified' AND is_published=1)),(SELECT COUNT(*) FROM (SELECT country_id,passport_nationality_iso3,travel_purpose FROM visa_requirements WHERE passport_nationality_iso3='BGD' AND travel_purpose='tourism' GROUP BY country_id,passport_nationality_iso3,travel_purpose HAVING COUNT(*)>1) d);")"
          echo "$RESTORE_COUNTS" > restore-test-counts.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("backup-meta.json").read_text())
          actual = list(map(int, Path("restore-test-counts.txt").read_text().split()))
          expected = meta["preflight"]
          keys = ("country_count", "requirement_count", "source_count", "published_count", "pending_count", "duplicate_keys")
          for index, key in enumerate(keys):
              if actual[index] != expected[key]:
                  raise SystemExit(f"Restore mismatch for {key}: expected {expected[key]}, got {actual[index]}")
          print("ISOLATED_MYSQL_RESTORE_COUNTS_MATCH_PRODUCTION_PREFLIGHT")
          PY
          echo "RESTORE_TEST_PASSED=true" >> "$GITHUB_ENV"
          rm -f production-backup.sql.gz

      - name: Apply Schengen checklist and photo supplements with production readback
        if: env.RESTORE_TEST_PASSED == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/unigo/backend/current
          php artisan db:seed --class='Database\Seeders\SchengenBangladeshChecklistSupplementSeeder' --force
          php <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $expected = ['AT','BE','BG','HR','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','CH'];
          $records = App\Models\VisaRequirement::query()
              ->with('country:id,iso2')
              ->where('passport_nationality_iso3', 'BGD')
              ->where('travel_purpose', 'tourism')
              ->whereHas('country', fn ($query) => $query->whereIn('iso2', $expected))
              ->get()
              ->keyBy(fn ($record) => strtoupper((string) $record->country?->iso2));
          if ($records->count() !== 29) {
              throw new RuntimeException('Expected 29 Schengen tourism records; found ' . $records->count());
          }
          foreach ($expected as $iso2) {
              $record = $records->get($iso2);
              if (! $record || $record->verification_status !== 'verified' || ! $record->is_published) {
                  throw new RuntimeException('Missing or unpublished verified Schengen record: ' . $iso2);
              }
              $photo = $record->photo_specifications;
              $checklists = $record->applicant_checklists;
              if (! is_array($photo) || empty($photo['status']) || ! is_array($checklists) || count($checklists) !== 4) {
                  throw new RuntimeException('Photo/checklist metadata missing or malformed: ' . $iso2);
              }
              foreach (['employee','self_employed_or_business_owner','student','retired'] as $type) {
                  if (! collect($checklists)->contains(fn ($item) => ($item['applicant_type'] ?? null) === $type && ! empty($item['documents']))) {
                      throw new RuntimeException('Applicant profile missing for ' . $iso2 . ': ' . $type);
                  }
              }
              $allDocs = collect($checklists)->flatMap(fn ($item) => $item['documents'] ?? [])->pluck('name')->implode(' | ');
              if ($iso2 === 'IT' && ! str_contains(strtolower($allDocs), 'apostill')) {
                  throw new RuntimeException('Italy apostille checklist item missing.');
              }
              if ($iso2 === 'HR' && ! str_contains(strtolower($allDocs), 'apostill')) {
                  throw new RuntimeException('Croatia conditional apostille checklist item missing.');
              }
              if (in_array($iso2, ['LT','RO'], true) && ($photo['status'] ?? null) !== 'not_verified') {
                  throw new RuntimeException('Unverified route was incorrectly marked as photo-verified: ' . $iso2);
              }
              if (in_array($iso2, ['MT','SK'], true) && str_contains(strtolower($allDocs), 'apostill')) {
                  throw new RuntimeException('Italy apostille rule was incorrectly applied to represented destination: ' . $iso2);
              }
              if (! $record->sources()->where('source_url', 'https://www.eeas.europa.eu/bangladesh/travel-study_en')->exists()) {
                  throw new RuntimeException('EEAS representation source missing for ' . $iso2);
              }
              if (! $record->sources()->where('source_url', 'https://www.consilium.europa.eu/en/policies/schengen-area/')->exists()) {
                  throw new RuntimeException('Current Schengen membership source missing for ' . $iso2);
              }
              if ($iso2 === 'BG' && (($photo['captured_at_vac'] ?? false) !== true || ($photo['status'] ?? null) !== 'partially_specified')) {
                  throw new RuntimeException('Bulgaria VFS photo capture metadata missing.');
              }
              if ($iso2 === 'GR' && ($photo['status'] ?? null) !== 'not_verified') {
                  throw new RuntimeException('Greece photo specification must remain unverified until its live checklist is retrieved.');
              }
              if ($iso2 === 'BG' && ! $record->sources()->where('source_url', 'https://visa.vfsglobal.com/bgd/en/bgr/')->exists()) {
                  throw new RuntimeException('Bulgaria VFS Bangladesh source missing.');
              }
              if ($iso2 === 'GR' && ! $record->sources()->where('source_url', 'https://visa.vfsglobal.com/bgd/en/grc/')->exists()) {
                  throw new RuntimeException('Greece VFS Bangladesh source missing.');
              }
          }
          echo "SCHENGEN_PRODUCTION_READBACK_OK countries=29 profiles=116 apostille=country-specific".PHP_EOL;
          PHP
          REMOTE

      - name: Verify public API checklist and photo data for all 29 Schengen countries
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen

          countries = ["AT","BE","BG","HR","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","CH"]
          base = "https://api.unigo-bd.com/api/visa-requirements/{}?passport=BGD&purpose=tourism"
          for iso2 in countries:
              request = Request(base.format(iso2), headers={"Accept":"application/json","User-Agent":"UniGo-Schengen-Checklist-Verification/1.0"})
              with urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"Public API HTTP {response.status}: {iso2}")
                  payload = json.loads(response.read().decode("utf-8"))
              record = payload.get("data")
              if payload.get("success") is not True or not isinstance(record, dict):
                  raise SystemExit(f"Public API returned no record: {iso2}")
              if not isinstance(record.get("photo_specifications"), dict):
                  raise SystemExit(f"Photo metadata missing from public API: {iso2}")
              checklists = record.get("applicant_checklists")
              if not isinstance(checklists, list) or len(checklists) != 4:
                  raise SystemExit(f"Applicant checklist profiles missing from public API: {iso2}")
              print(f"PUBLIC_SCHENGEN_CHECKLIST_OK {iso2}")
          print("PUBLIC_SCHENGEN_CHECKLISTS_OK countries=29")
          PY
