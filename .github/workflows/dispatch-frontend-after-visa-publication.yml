name: Dispatch frontend after visa publication

on:
  push:
    branches:
      - main
    paths:
      - 'docs/frontend-content-dispatch.trigger'
  workflow_run:
    workflows:
      - Deploy UniGo Backend
      - Import staged 12-country visa batch
      - Import verified country visa batch 18
      - Import verified tourism visa batch 24
      - Repair primary official sources for Korea and Singapore
      - Import verified tourism visa batch 26
      - Import verified tourism visa batch 27
      - Import verified country batches 19 and 20
      - Import verified country backlog batches 21, 22 and 23
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-frontend-content-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      FRONTEND_DISPATCH_TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
    steps:
      - name: Verify public visa APIs before dispatch
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "https://api.unigo-bd.com/api"

          def get(path):
              last_error = None
              for attempt in range(5):
                  request = Request(
                      base + path,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "UniGo-Publication-Dispatch/1.0",
                      },
                  )
                  try:
                      with urlopen(request, timeout=45) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}: {path}")
                          return json.loads(response.read().decode("utf-8"))
                  except (HTTPError, URLError, TimeoutError, RuntimeError) as error:
                      last_error = error
                      if attempt == 4:
                          break
                      time.sleep(10 * (attempt + 1))
              raise SystemExit(f"Public API did not recover after five attempts: {path}: {last_error}")

          countries = get("/countries")
          requirements = get("/visa-requirements?passport=BGD&purpose=tourism")
          country_rows = countries.get("data")
          requirement_rows = requirements.get("data")

          if countries.get("success") is not True or not isinstance(country_rows, list):
              raise SystemExit("Country directory API is invalid.")
          if requirements.get("success") is not True or not isinstance(requirement_rows, list):
              raise SystemExit("BGD tourism requirements API is invalid.")

          country_slugs = {row.get("slug") for row in country_rows}
          requirement_slugs = {
              (row.get("country") or {}).get("slug")
              for row in requirement_rows
          }

          if None in country_slugs or len(country_slugs) != len(country_rows):
              raise SystemExit("Country directory contains empty or duplicate slugs.")
          if None in requirement_slugs or len(requirement_slugs) != len(requirement_rows):
              raise SystemExit("Visa requirements contain empty or duplicate country slugs.")
          if country_slugs != requirement_slugs:
              raise SystemExit("Country directory and published requirement slugs do not match.")

          for row in requirement_rows:
              if row.get("passport_nationality_iso3") != "BGD" or row.get("travel_purpose") != "tourism":
                  raise SystemExit("Unexpected passport nationality or travel purpose.")
              if row.get("verification_status") != "verified" or row.get("is_published") is not True:
                  raise SystemExit("An API requirement is not verified and published.")
              if not any(
                  source.get("source_type") == "official" and source.get("is_primary") is True
                  for source in row.get("sources", [])
              ):
                  raise SystemExit(f"Missing primary official source: {(row.get('country') or {}).get('slug')}")

          print(f"PUBLICATION_READY countries={len(country_rows)} requirements={len(requirement_rows)}")
          PY

      - name: Dispatch frontend rebuild
        if: env.FRONTEND_DISPATCH_TOKEN != ''
        env:
          FRONTEND_DISPATCH_TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || 'Manual dispatch' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $FRONTEND_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/raadislam/unigo-frontend/dispatches \
            -d "$(python3 -c 'import json,os; print(json.dumps({"event_type":"visa-content-updated","client_payload":{"source_workflow":os.environ["SOURCE_WORKFLOW"],"source_run_id":os.environ["SOURCE_RUN_ID"]}}))')"
          echo "FRONTEND_REPOSITORY_DISPATCH_SENT"

      - name: Explain missing cross-repository token
        if: env.FRONTEND_DISPATCH_TOKEN == ''
        env:
          FRONTEND_DISPATCH_TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
        run: |
          echo "::warning::Set the backend repository secret FRONTEND_DISPATCH_TOKEN to enable immediate frontend deployments. The frontend 15-minute scheduled reconciliation remains active."
