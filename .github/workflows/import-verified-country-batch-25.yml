          base="https://api.unigo-bd.com/api"
          def get(path):
            request=Request(base+path,headers={"Accept":"application/json","User-Agent":"UniGo-Primary-Source-Repair-Batch-25/1.0"})
            with urlopen(request,timeout=45) as response:
              if response.status!=200: raise SystemExit(f"Public API HTTP {response.status}: {path}")
