          directory=get("/countries")
          listing=get("/visa-requirements?passport=BGD&purpose=tourism")
          directory_rows=directory.get("data")
          requirement_rows=listing.get("data")
          if not isinstance(directory_rows,list) or not isinstance(requirement_rows,list):
            raise SystemExit("Public API response shape is invalid.")
          if len(directory_rows)!=pre.get("public_country_directory_count") or len(requirement_rows)!=pre.get("public_country_directory_count"):
            raise SystemExit("Public API counts changed unexpectedly during source-only repair.")
          by_slug={r.get("country",{}).get("slug"):r for r in requirement_rows if (r.get("country") or {}).get("slug")}
          if set(by_slug)!={c.get("slug") for c in directory_rows}:
