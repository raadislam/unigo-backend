            if code=="KR" and record.get("evisa_available") is not False:
              raise SystemExit("Korea e-form was incorrectly marked as an eVisa.")
            sources=record.get("sources",[])
            if len({s.get("source_url") for s in sources})!=len(sources):
              raise SystemExit(f"{code}: duplicate source URLs remain.")
            primary=[s for s in sources if s.get("source_type")=="official" and bool(s.get("is_primary"))]
            if len(primary)!=1 or primary[0].get("source_url")!=row.get("official_source_url"):
              raise SystemExit(f"{code}: exactly one correct primary official source is required.")
            expected={row.get("official_source_url"),row.get("cross_check_source_url")} | {s.get("source_url") for s in json.loads(row.get("additional_sources") or "[]")}
            actual={s.get("source_url") for s in sources}
            if not expected.issubset(actual):
