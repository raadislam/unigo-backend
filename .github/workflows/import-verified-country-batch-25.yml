name: Repair primary official sources for Korea and Singapore

on:
  push:
    branches:
      - main
    paths:
      - scripts/run-verified-country-import-batch-25.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate batch 25 source repair allowlist
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          expected = {"KR","SG"}
          checked = "2026-11-14"
          simple = list(csv.DictReader(Path("database/data/new_country_visa_batch_25.csv").open(encoding="utf-8-sig", newline="")))
          audit = list(csv.DictReader(Path("database/data/visa_full_audit_batch_25.csv").open(encoding="utf-8-sig", newline="")))
          if len(simple) != 2 or len(audit) != 2:
            raise SystemExit("Batch 25 must contain exactly two seed and two full-audit rows.")
          simple_by = {r["destination_iso2"]:r for r in simple}
          audit_by = {r["destination_iso2"]:r for r in audit}
          if set(simple_by) != expected or set(audit_by) != expected:
            raise SystemExit("Batch 25 allowlist must be exactly KR and SG.")
          if len(simple_by) != len(simple) or len(audit_by) != len(audit):
            raise SystemExit("Duplicate country ISO2 in batch 25.")
          for code,row in audit_by.items():
            if row.get("passport_iso3") != "BGD" or row.get("passport_nationality") != "Bangladesh" or row.get("travel_purpose") != "tourism":
              raise SystemExit(f"{code}: wrong nationality or purpose.")
            if row.get("verification_status") != "verified" or row.get("publish_status") != "published" or row.get("full_audit") != "true":
              raise SystemExit(f"{code}: row is not verified and approved for publication.")
            if row.get("official_source_last_checked") != checked or row.get("cross_check_source_last_checked") != checked:
              raise SystemExit(f"{code}: primary/cross source checked date mismatch.")
            for field in ("official_source_url","cross_check_source_url"):
              parsed=urlparse(row.get(field,""))
              if parsed.scheme!="https" or not parsed.netloc:
                raise SystemExit(f"{code}: invalid {field}.")
            if code=="SG" and row.get("evisa_available")!="true":
              raise SystemExit("Singapore eVisa status must be true based on ICA's Bangladesh page.")
            if code=="KR" and row.get("evisa_available")!="false":
              raise SystemExit("Korea's online e-form must not be misclassified as an eVisa.")
            extra=json.loads(row.get("additional_sources") or "[]")
            if len(extra)<2:
              raise SystemExit(f"{code}: at least two additional official sources are required.")
            required={row.get("official_source_url"),row.get("cross_check_source_url")}
            seen=set()
            for item in extra:
              if item.get("source_type")!="official" or not item.get("source_name") or not item.get("verification_notes"):
                raise SystemExit(f"{code}: every additional source must be an official, named source with notes.")
              parsed=urlparse(item.get("source_url",""))
              if parsed.scheme!="https" or not parsed.netloc or item.get("source_url") in required:
                raise SystemExit(f"{code}: invalid or duplicate primary/cross additional source.")
              if item.get("source_last_checked_at")!=checked:
                raise SystemExit(f"{code}: additional source checked date mismatch.")
              if item.get("source_url") in seen:
                raise SystemExit(f"{code}: duplicate additional source URL.")
              seen.add(item.get("source_url"))
            seed=simple_by[code]
            for field in ("passport_iso3","passport_nationality","travel_purpose","visa_requirement_type","visa_required","visa_free_eligibility","visa_on_arrival_available","evisa_available","application_fee","processing_time","official_source_url","verification_status"):
              if seed.get(field)!=row.get(field):
                raise SystemExit(f"{code}: seed/full-audit mismatch in {field}.")
            if seed.get("cross_check_source_url") or seed.get("cross_check_source_name"):
              raise SystemExit(f"{code}: seed cross-check fields must be blank to avoid duplicate secondary source rows.")
          with Path("verified_full_audit_batch_25.csv").open("w",encoding="utf-8",newline="") as handle:
            writer=csv.DictWriter(handle,fieldnames=list(audit[0].keys()),lineterminator="\\n")
            writer.writeheader()
            writer.writerows([audit_by[c] for c in sorted(expected)])
          print("BATCH25_VALIDATION_PASSED allowlist=KR,SG rows=2")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-country-batch-25
          path: |
            database/data/new_country_visa_batch_25.csv
            database/data/visa_full_audit_batch_25.csv
            verified_full_audit_batch_25.csv

  repair-production:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-country-batch-25
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          install -m 700 -d ~/.ssh
          printf '%s\\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_import
          chmod 600 ~/.ssh/unigo_import
          for attempt in $(seq 1 5); do
            if ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'command -v php && command -v mysql && command -v mysqldump && command -v gzip'
      - name: Upload exact batch 25 files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p /var/www/unigo/backend/shared/imports'
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" database/data/new_country_visa_batch_25.csv verified_full_audit_batch_25.csv "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/"
      - name: Export and validate pre-repair production audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cd "$APP_DIR"
          php artisan visa:requirements-audit > "$IMPORT_DIR/batch25_pre_import_audit.json"
          test -s "$IMPORT_DIR/batch25_pre_import_audit.json"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_pre_import_audit.json" ./batch25_pre_import_audit.json
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          expected={"KR","SG"}
          rows={r["destination_iso2"]:r for r in csv.DictReader(Path("verified_full_audit_batch_25.csv").open(encoding="utf-8-sig",newline=""))}
          audit=json.loads(Path("batch25_pre_import_audit.json").read_text())
          ledger=list(csv.DictReader(Path("database/data/country_discovery_ledger.csv").open(encoding="utf-8-sig",newline="")))
          if audit.get("country_table_count")!=len(ledger):
            raise SystemExit("Country table count does not match the master discovery ledger.")
          country_by={c.get("iso2"):c for c in audit.get("country_table",[])}
          if expected-set(country_by):
            raise SystemExit("Korea or Singapore country master row is missing.")
          records={}
          for r in audit.get("records",[]):
            code=(r.get("country") or {}).get("iso2")
            if code in expected and r.get("passport_nationality_iso3")=="BGD" and r.get("travel_purpose")=="tourism":
              records.setdefault(code,[]).append(r)
          if set(records)!=expected or any(len(v)!=1 for v in records.values()):
            raise SystemExit("Expected exactly one existing BGD tourism requirement for KR and SG.")
          summary={"total_before":audit.get("total"),"published_before":audit.get("published_count"),"country_table_count_before":audit.get("country_table_count"),"public_directory_count_before":audit.get("public_country_directory_count"),"public_directory_codes_before":sorted(c.get("iso2") for c in audit.get("public_country_directory",[]) if c.get("iso2"))}
          for code,row in rows.items():
            record=records[code][0]
            if record.get("verification_status")!="verified" or record.get("is_published") is not True:
              raise SystemExit(f"{code}: existing record is not verified and published.")
            sources=record.get("sources",[])
            if any(s.get("is_primary") is True and s.get("source_type")=="official" for s in sources):
              raise SystemExit(f"{code}: a primary official source already exists; do not run the repair.")
            for field in ("official_source_url","cross_check_source_url"):
              matches=[s for s in sources if s.get("source_url")==row.get(field) and s.get("source_type")=="official"]
              if len(matches)!=1:
                raise SystemExit(f"{code}: expected exactly one existing official source row for {field}.")
            if len({s.get("source_url") for s in sources})!=len(sources):
              raise SystemExit(f"{code}: existing source URLs contain duplicates; manual review required.")
          Path("batch25_pre_import_summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          print("BATCH25_PRE_REPAIR_DATABASE_CHECK_PASSED")
          PY
      - name: Create fresh production database backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          SHARED_DIR="/var/www/unigo/backend/shared"
          IMPORT_DIR="$SHARED_DIR/imports"
          BACKUP_DIR="$SHARED_DIR/backups"
          mkdir -p "$BACKUP_DIR"
          test -f "$SHARED_DIR/.env"
          test -f "$APP_DIR/vendor/autoload.php"
          test -s "$IMPORT_DIR/new_country_visa_batch_24.csv"
          test -s "$IMPORT_DIR/verified_full_audit_batch_24.csv"
          test -s "$IMPORT_DIR/batch25_pre_import_audit.json"
          CNF="$(mktemp)"
          DB_FILE="$(mktemp)"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-$$"
          BACKUP_FILE="$BACKUP_DIR/unigo-pre-verified-batch-24-$STAMP.sql.gz"
          trap 'rm -f "$CNF" "$DB_FILE"' EXIT
          cd "$APP_DIR"
          BACKUP_CNF="$CNF" DB_NAME_FILE="$DB_FILE" UNIGO_APP_DIR="$APP_DIR" php <<'PHP'
          <?php
          $root = getenv('UNIGO_APP_DIR');
          chdir($root);
          require $root . '/vendor/autoload.php';
          $app = require $root . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $connection = config('database.connections.' . config('database.default'));
          if (!is_array($connection) || ($connection['driver'] ?? '') !== 'mysql') { fwrite(STDERR, "Expected MySQL production connection.\n"); exit(1); }
          $database = (string) ($connection['database'] ?? '');
          if ($database === '') { fwrite(STDERR, "Production database name unavailable.\n"); exit(1); }
          $escape = static fn ($value) => '"' . str_replace(["\\", '"', "\n", "\r"], ["\\\\", '\\"', "\n", "\r"], (string) $value) . '"';
          $options = ['host' => $connection['host'] ?? '127.0.0.1', 'port' => $connection['port'] ?? 3306, 'user' => $connection['username'] ?? '', 'password' => $connection['password'] ?? '', 'default-character-set' => $connection['charset'] ?? 'utf8mb4'];
          if (!empty($connection['unix_socket'])) $options['socket'] = $connection['unix_socket'];
          $content = "[client]\n";
          foreach ($options as $key => $value) $content .= $key . '=' . $escape($value) . "\n";
          if (file_put_contents(getenv('BACKUP_CNF'), $content, LOCK_EX) === false || file_put_contents(getenv('DB_NAME_FILE'), $database, LOCK_EX) === false) { fwrite(STDERR, "Unable to prepare protected backup configuration.\n"); exit(1); }
          chmod(getenv('BACKUP_CNF'), 0600);
          chmod(getenv('DB_NAME_FILE'), 0600);
          PHP
          DB_NAME="$(cat "$DB_FILE")"
          mysqldump --defaults-extra-file="$CNF" --no-tablespaces --single-transaction --quick --routines --triggers --events --hex-blob --default-character-set=utf8mb4 "$DB_NAME" | gzip -1 > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          gzip -t "$BACKUP_FILE"
          sha256sum "$BACKUP_FILE" > "$BACKUP_FILE.sha256"
          printf '%s\n' "$BACKUP_FILE" > "$IMPORT_DIR/batch25_backup_path.txt"
          printf '%s\n' "$BACKUP_FILE.sha256" > "$IMPORT_DIR/batch25_backup_checksum_path.txt"
          printf '%s\n' "$(sha256sum "$BACKUP_FILE" | awk '{print $1}')" > "$IMPORT_DIR/batch25_backup_sha256.txt"
          echo "PRODUCTION_BACKUP_CREATED_AND_GZIP_VERIFIED $BACKUP_FILE"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_backup_path.txt" ./batch25_backup_path.txt
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_backup_checksum_path.txt" ./batch25_backup_checksum_path.txt
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_backup_sha256.txt" ./batch25_backup_sha256.txt
      - name: Restore-test backup in isolated MySQL 8
      - name: Restore-test backup in isolated MySQL 8
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          BACKUP_PATH="$(ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cat /var/www/unigo/backend/shared/imports/batch25_backup_path.txt')"
          CHECKSUM_PATH="$(ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cat /var/www/unigo/backend/shared/imports/batch25_backup_checksum_path.txt')"
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$BACKUP_PATH" ./unigo-production-backup.sql.gz
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$CHECKSUM_PATH" ./unigo-production-backup.sql.gz.sha256
          EXPECTED_SHA="$(awk '{print $1}' ./unigo-production-backup.sql.gz.sha256)"
          ACTUAL_SHA="$(sha256sum ./unigo-production-backup.sql.gz | awk '{print $1}')"
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          docker run --name unigo-mysql-batch25-restore -e MYSQL_ROOT_PASSWORD=unigo_restore_test -d mysql:8.0
          trap 'docker rm -f unigo-mysql-batch25-restore >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do docker exec unigo-mysql-batch25-restore mysql -uroot -punigo_restore_test -e "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec unigo-mysql-batch25-restore mysql -uroot -punigo_restore_test -e "CREATE DATABASE unigo_restore_verify"
          gzip -dc ./unigo-production-backup.sql.gz | docker exec -i unigo-mysql-batch25-restore mysql -uroot -punigo_restore_test unigo_restore_verify
          TABLES="$(docker exec unigo-mysql-batch25-restore mysql -uroot -punigo_restore_test --batch --skip-column-names unigo_restore_verify -e "SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema='unigo_restore_verify' AND table_type='BASE TABLE'")"
          test -n "$TABLES"
          while IFS= read -r table; do
            count="$(docker exec unigo-mysql-batch25-restore mysql -uroot -punigo_restore_test --batch --skip-column-names unigo_restore_verify -e "SELECT COUNT(*) FROM \`$table\`")"
            test "$count" -ge 0
          done <<< "$TABLES"
          echo "BACKUP_SHA256_AND_RESTORE_TEST_PASSED_IN_ISOLATED_MYSQL"
      - name: Run dry-run for the two existing verified records
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cd "$APP_DIR"
          php artisan visa:requirements-import-research --file="$IMPORT_DIR/verified_full_audit_batch_25.csv" --base-url=https://api.unigo-bd.com --dry-run > "$IMPORT_DIR/batch25_dry_run.json"
          test -s "$IMPORT_DIR/batch25_dry_run.json"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_dry_run.json" ./batch25_dry_run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("batch25_dry_run.json").read_text())
          if result.get("mode")!="dry_run" or result.get("rows")!=2 or result.get("failures"):
            raise SystemExit(f"Batch 25 dry-run failed: {result}")
          print("BATCH25_DRY_RUN_PASSED")
          PY
      - name: Promote the existing official source rows without creating duplicates
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cat > "$IMPORT_DIR/promote_primary_sources_batch25.php" <<'PHP'
          <?php
          use App\\Models\\VisaRequirement;
          use App\\Models\\VisaRequirementSource;
          use Illuminate\\Contracts\\Console\\Kernel;

          $root = '/var/www/unigo/backend/current';
          require $root . '/vendor/autoload.php';
          $app = require $root . '/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $expected = [
              'KR' => [
                  'primary' => 'https://overseas.mofa.go.kr/bd-en/brd/m_23302/view.do?seq=14',
                  'cross' => 'https://overseas.mofa.go.kr/bd-en/brd/m_2124/view.do?seq=760059',
              ],
              'SG' => [
                  'primary' => 'https://dhaka.mfa.gov.sg/consular-services/visa-information/visa-application/',
                  'cross' => 'https://www.ica.gov.sg/enter-transit-depart/entering-singapore/visa_requirements/visa-detail-page/bangladesh',
              ],
          ];
          $report = [];
          foreach ($expected as $code => $urls) {
              $requirement = VisaRequirement::query()
                  ->where('passport_nationality_iso3', 'BGD')
                  ->where('travel_purpose', 'tourism')
                  ->whereHas('country', function ($query) use ($code) {
                      $query->where('iso2', $code);
                  })
                  ->first();
              if (!$requirement || $requirement->verification_status !== 'verified' || !$requirement->is_published) {
                  throw new RuntimeException($code . ': expected an existing verified published BGD tourism record.');
              }
              if ($requirement->sources()->where('source_type', 'official')->where('is_primary', true)->count() !== 0) {
                  throw new RuntimeException($code . ': primary official source already exists; refusing to overwrite.');
              }
              foreach (['primary', 'cross'] as $kind) {
                  $url = $urls[$kind];
                  $matches = VisaRequirementSource::query()
                      ->where('visa_requirement_id', $requirement->id)
                      ->where('source_type', 'official')
                      ->where('source_url', $url)
                      ->get();
                  if ($matches->count() !== 1) {
                      throw new RuntimeException($code . ': expected exactly one existing official source row for ' . $kind . '.');
                  }
                  $source = $matches->first();
                  if ($source->source_last_checked_at && $source->source_last_checked_at->toDateString() > '2026-11-14') {
                      throw new RuntimeException($code . ': refusing to move a source checked date backwards.');
                  }
                  $source->forceFill([
                      'is_primary' => $kind === 'primary',
                      'source_last_checked_at' => '2026-11-14 00:00:00',
                  ])->save();
              }
              $primaryCount = $requirement->sources()->where('source_type', 'official')->where('is_primary', true)->count();
              if ($primaryCount !== 1) {
                  throw new RuntimeException($code . ': primary official source count is not exactly one after repair.');
              }
              $report[] = ['iso2' => $code, 'requirement_id' => $requirement->id, 'primary_source_promoted' => true, 'cross_source_checked' => true];
          }
          file_put_contents('/var/www/unigo/backend/shared/imports/batch25_source_promotion.json', json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          echo "BATCH25_PRIMARY_SOURCE_ROWS_PROMOTED " . json_encode($report, JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
          cd "$APP_DIR"
          php "$IMPORT_DIR/promote_primary_sources_batch25.php"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_source_promotion.json" ./batch25_source_promotion.json
      - name: Import and export post-repair audit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/unigo_import -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          IMPORT_DIR="/var/www/unigo/backend/shared/imports"
          cd "$APP_DIR"
          php artisan visa:requirements-import-research --file="$IMPORT_DIR/verified_full_audit_batch_25.csv" --base-url=https://api.unigo-bd.com > "$IMPORT_DIR/batch25_import_result.json"
          php artisan visa:requirements-audit > "$IMPORT_DIR/batch25_post_import_audit.json"
          test -s "$IMPORT_DIR/batch25_import_result.json"
          test -s "$IMPORT_DIR/batch25_post_import_audit.json"
          REMOTE
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_import_result.json" ./batch25_import_result.json
          scp -i ~/.ssh/unigo_import -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/var/www/unigo/backend/shared/imports/batch25_post_import_audit.json" ./batch25_post_import_audit.json
      - name: Verify primary source flags, full record readback and public API
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          from urllib.request import Request,urlopen
          rows={r["destination_iso2"]:r for r in csv.DictReader(Path("verified_full_audit_batch_25.csv").open(encoding="utf-8-sig",newline=""))}
          pre=json.loads(Path("batch25_pre_import_audit.json").read_text())
          post=json.loads(Path("batch25_post_import_audit.json").read_text())
          imported=json.loads(Path("batch25_import_result.json").read_text())
          summary=json.loads(Path("batch25_pre_import_summary.json").read_text())
          if imported.get("mode")!="import" or imported.get("rows")!=2 or imported.get("failures") or imported.get("read_back")!=2 or imported.get("reverified")!=2 or imported.get("republished")!=2:
            raise SystemExit(f"Importer did not confirm both records: {imported}")
          for key in ("total","published_count","country_table_count","public_country_directory_count"):
            if post.get(key)!=pre.get(key):
              raise SystemExit(f"Unexpected production count change in {key}.")
          records={}
          for r in post.get("records",[]):
            code=(r.get("country") or {}).get("iso2")
            if code in rows and r.get("passport_nationality_iso3")=="BGD" and r.get("travel_purpose")=="tourism":
