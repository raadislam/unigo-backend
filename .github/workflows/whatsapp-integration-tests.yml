name: WhatsApp AI integration tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/Http/Controllers/Api/WhatsAppWebhookController.php'
      - 'app/Services/WhatsAppService.php'
      - 'config/services.php'
      - '.env.example'
      - 'routes/api.php'
      - 'tests/Feature/WhatsAppWebhookTest.php'
      - '.github/workflows/whatsapp-integration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan test --compact --filter=WhatsAppWebhookTest
