name: Validate Visa Research Batches

on:
  push:
    branches:
      - 'automation/country-discovery-*'
    paths:
      - 'database/data/visa_full_audit_batch_*.csv'
      - 'database/data/new_country_visa_batch_*.csv'
      - 'database/data/country_discovery_ledger.csv'
      - 'scripts/validate_visa_batches.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-visa-batches.yml'
      - 'docs/visa-discovery-batch-09-release-checklist.md'
  pull_request:
    paths:
      - 'database/data/visa_full_audit_batch_*.csv'
      - 'database/data/new_country_visa_batch_*.csv'
      - 'database/data/country_discovery_ledger.csv'
      - 'scripts/validate_visa_batches.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-visa-batches.yml'
      - 'docs/visa-discovery-batch-09-release-checklist.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSV schema, field limits, official sources and idempotency keys
        run: python3 scripts/validate_visa_batches.py
