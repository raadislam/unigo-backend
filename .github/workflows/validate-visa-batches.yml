name: Validate Visa Research Batches

on:
  push:
    branches:
      - main
    paths:
      - 'database/data/visa_full_audit_batch_*.csv'
      - 'database/data/new_country_visa_batch_*.csv'
      - 'database/data/country_discovery_ledger.csv'
      - 'database/data/destination_discovery_batch_*.csv'
      - 'database/data/photo_checklist_research_batch_*.csv'
      - 'scripts/validate_visa_batches.py'
      - 'scripts/validate_visa_batch_45.py'
      - 'database/seeders/TristanDaCunhaCountryBackfillSeeder.php'
      - '.github/workflows/import-verified-country-batch-45.yml'
      - 'docs/visa-discovery-batch-45-tristan-da-cunha-research.md'
      - 'scripts/validate_production_visa_audit.py'
      - 'app/Console/Commands/VisaRequirementResearchCsvImportCommand.php'
      - 'app/Console/Commands/VisaRequirementAuditCommand.php'
      - 'app/Http/Controllers/Api/Admin/VisaRequirementManagementController.php'
      - 'database/seeders/SchengenBangladeshChecklistSupplementSeeder.php'
      - 'scripts/validate_schengen_checklist_seeder.py'
      - 'docs/schengen-bangladesh-vfs-checklist-audit-2026-11-15.md'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-visa-batches.yml'
      - '.github/workflows/update-schengen-checklists.yml'
      - '.github/workflows/dispatch-frontend-after-visa-publication.yml'
      - '.github/workflows/import-verified-country-batch-38.yml'
      - '.github/workflows/import-verified-country-batch-41.yml'
      - '.github/workflows/import-verified-country-batches-19-20.yml'
      - 'docs/visa-discovery-batch-09-release-checklist.md'
  pull_request:
    paths:
      - 'database/data/visa_full_audit_batch_*.csv'
      - 'database/data/new_country_visa_batch_*.csv'
      - 'database/data/country_discovery_ledger.csv'
      - 'database/data/destination_discovery_batch_*.csv'
      - 'database/data/photo_checklist_research_batch_*.csv'
      - 'scripts/validate_visa_batches.py'
      - 'scripts/validate_visa_batch_45.py'
      - 'database/seeders/TristanDaCunhaCountryBackfillSeeder.php'
      - '.github/workflows/import-verified-country-batch-45.yml'
      - 'docs/visa-discovery-batch-45-tristan-da-cunha-research.md'
      - 'scripts/validate_production_visa_audit.py'
      - 'app/Console/Commands/VisaRequirementResearchCsvImportCommand.php'
      - 'app/Console/Commands/VisaRequirementAuditCommand.php'
      - 'app/Http/Controllers/Api/Admin/VisaRequirementManagementController.php'
      - 'tests/Feature/VisaRequirementApplicantChecklistMetadataTest.php'
      - '.github/workflows/import-verified-country-batches-19-20.yml'
      - 'database/seeders/SchengenBangladeshChecklistSupplementSeeder.php'
      - 'scripts/validate_schengen_checklist_seeder.py'
      - 'docs/schengen-bangladesh-vfs-checklist-audit-2026-11-15.md'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-visa-batches.yml'
      - '.github/workflows/update-schengen-checklists.yml'
      - '.github/workflows/import-verified-country-batch-38.yml'
      - '.github/workflows/import-verified-country-batch-41.yml'
      - 'docs/visa-discovery-batch-09-release-checklist.md'

permissions:
  contents: read

concurrency:
  group: unigo-visa-batch-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
      - name: Set up PHP for importer syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, bcmath, curl, xml, zip
      - name: Validate importer PHP syntax
        run: |
          php -l app/Console/Commands/VisaRequirementResearchCsvImportCommand.php
          php -l app/Console/Commands/VisaRequirementAuditCommand.php
          php -l app/Http/Controllers/Api/Admin/VisaRequirementManagementController.php
          php -l database/seeders/SchengenBangladeshChecklistSupplementSeeder.php
          php -l database/seeders/TristanDaCunhaCountryBackfillSeeder.php
          php -l tests/Feature/VisaRequirementApplicantChecklistMetadataTest.php
      - name: Install Composer dependencies for regression tests
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run applicant checklist metadata regression tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --filter=VisaRequirementApplicantChecklistMetadataTest
      - name: Lint embedded batch 38 production readback PHP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/import-verified-country-batch-38.yml").read_text()
          marker = "cat > /tmp/batch38-readback.php <<'PHP'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PHP\n", start)
          lines = workflow[start:end].splitlines()
          php = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("/tmp/batch38-readback.php").write_text(php)
          PY
          php -l /tmp/batch38-readback.php
      - name: Lint batch 41 workflow Python and embedded PHP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path(".github/workflows/import-verified-country-batch-41.yml").read_text()
          step_start = workflow.index("name: Filter and validate exact UG and ZW allowlist")
          prepare_marker = "python3 - <<'PY'\n"
          prepare_start = workflow.index(prepare_marker, step_start) + len(prepare_marker)
          prepare_end = workflow.index("\n          PY", prepare_start)
          prepare_source = textwrap.dedent(workflow[prepare_start:prepare_end])
          compile(prepare_source, "batch41_prepare.py", "exec")

          for stage in ("preflight", "readback"):
              marker = f"cat > /tmp/batch41-{stage}.php <<'PHP'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PHP", start)
              source = textwrap.dedent(workflow[start:end])
              target = Path(f"/tmp/batch41-{stage}.php")
              target.write_text(source + "\n")
              subprocess.run(["php", "-l", str(target)], check=True)
          PY
      - name: Validate batch 41 import workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/import-verified-country-batch-41.yml", aliases: true)'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Schengen checklist country coverage and apostille rules
        run: python3 scripts/validate_schengen_checklist_seeder.py
      - name: Validate CSV schema, field limits, official sources and idempotency keys
        run: python3 scripts/validate_visa_batches.py
      - name: Validate strict batch 45 allowlist and territory metadata
        run: |
          python3 -m py_compile scripts/validate_visa_batch_45.py
          python3 scripts/validate_visa_batch_45.py
      - name: Validate production import workflow YAML
        run: ruby -e 'require "yaml"; [".github/workflows/import-verified-country-batch-38.yml", ".github/workflows/import-verified-country-batch-45.yml", ".github/workflows/import-verified-country-batches-19-20.yml", ".github/workflows/update-schengen-checklists.yml", ".github/workflows/dispatch-frontend-after-visa-publication.yml"].each { |path| YAML.load_file(path); puts "#{path} YAML syntax OK" }'
