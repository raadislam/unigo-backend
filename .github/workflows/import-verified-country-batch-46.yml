          php -r '$j=json_decode(file_get_contents("/tmp/batch46-import-result.json"),true); if(!is_array($j)||($j["rows"]??0)!==1||($j["read_back"]??0)!==1||($j["reverified"]??0)!==1||($j["republished"]??0)!==1||!empty($j["failures"])) { fwrite(STDERR,"BATCH46_IMPORT_RESULT_MISMATCH ".json_encode($j).PHP_EOL); exit(1); }'
          php artisan visa:requirements-audit > /tmp/batch46-audit-after.json
          APP_ROOT="$APP" php /tmp/batch46-readback.php > /tmp/batch46-readback.json
