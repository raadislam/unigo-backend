          cp /tmp/batch46-source-repair.json /var/www/unigo/backend/shared/imports/batch46-source-repair.json
          cp /tmp/batch46-readback.json /var/www/unigo/backend/shared/imports/batch46-readback.json
          cp /tmp/batch46-audit-after.json /var/www/unigo/backend/shared/imports/batch46-post-import-audit.json
          cat /tmp/batch46-readback.json
          REMOTE
          python3 -m json.tool batch46-production-result.json > /dev/null
          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:/tmp/batch46-source-repair.json" batch46-source-repair.json
          cat batch46-production-result.json
      - name: Withhold batch 46 if production import or readback fails
        if: failure() && steps.production.outcome == 'failure'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/var/www/unigo/backend/current
          cd "$APP"
          if [ ! -f /tmp/batch46-import-started.marker ]; then
            echo "BATCH46_IMPORT_NOT_STARTED; no visa record could have been published."
            exit 0
          fi
          if [ ! -f /tmp/verified_full_audit_batch_46.csv ]; then
            echo "BATCH46_AUDIT_FILE_MISSING; do not attempt a broad rollback."
            exit 1
          fi
          php artisan visa:requirements-import-research --file=/tmp/verified_full_audit_batch_46.csv --unpublish-only > /tmp/batch46-unpublish-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/batch46-unpublish-result.json").read_text())
          if data.get("mode") != "unpublish_only" or data.get("rows") != 1 or data.get("unpublished") != 1 or data.get("read_back") != 1 or data.get("failures"):
              raise SystemExit("Batch 46 unpublish-only safety readback failed: " + json.dumps(data))
          print("BATCH46_FAILED_RECORD_WITHHELD", json.dumps(data))
          PY
          BATCH_HASH="$(sha256sum /tmp/verified_full_audit_batch_46.csv | awk '{print $1}')"
          MARKER="storage/logs/visa-imports-${BATCH_HASH}.json"
          if [ -f "$MARKER" ]; then
            rm "$MARKER"
            echo "BATCH46_REIMPORT_MARKER_CLEARED"
          fi
          REMOTE
      - name: Upload non-sensitive audit and verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unigo-batch-46-audit-results
          path: |
            backup-meta.json
            restore-test-counts.txt
            staging-migrations.txt
            staging-country-seeder.log
            staging-requirement-seeder.log
            staging-dry-run.json
            staging-import-result.json
            staging-source-repair.json
            staging-audit.json
            batch46-source-repair.json
            staging-readback.json
            batch46-production-result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Clean up isolated MySQL restore container
        if: always()
        run: docker rm -f unigo-batch46-restore >/dev/null 2>&1 || true
