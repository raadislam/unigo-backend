name: Safe WhatsApp Knowledge Migration

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/whatsapp-migration.trigger'
      - '.github/workflows/safe-whatsapp-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unigo-backend-production
  cancel-in-progress: false

jobs:
  backup-restore-test-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH with pinned host-key verification
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is missing}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS secret is missing}"
          : "${VPS_HOST:?VPS_HOST secret is missing}"
          : "${VPS_PORT:?VPS_PORT secret is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_deploy
          chmod 600 ~/.ssh/unigo_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/pinned_known_hosts
          chmod 600 ~/.ssh/pinned_known_hosts
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/scanned_known_hosts 2>~/.ssh/keyscan.log
          test -s ~/.ssh/scanned_known_hosts
          awk 'NF >= 3 && $1 !~ /^#/ { if ($1 ~ /^@/) print $3 " " $4; else print $2 " " $3 }' ~/.ssh/pinned_known_hosts | sort -u > ~/.ssh/pinned_keys
          awk 'NF >= 3 && $1 !~ /^#/ { print $2 " " $3 }' ~/.ssh/scanned_known_hosts | sort -u > ~/.ssh/scanned_keys
          if ! grep -Fxf ~/.ssh/pinned_keys ~/.ssh/scanned_keys >/dev/null; then
            echo "VPS host-key mismatch. Migration stopped."
            exit 1
          fi
          awk 'NR == FNR { pinned[$0] = 1; next } (($2 " " $3) in pinned) { print }' ~/.ssh/pinned_keys ~/.ssh/scanned_known_hosts > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check backup and restore utilities
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'command -v php && command -v mysql && command -v mysqldump && command -v gzip && command -v sha256sum'

      - name: Backup, verify, restore-test, migrate production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/unigo_deploy -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR="/var/www/unigo/backend/current"
          SHARED_DIR="/var/www/unigo/backend/shared"
          BACKUP_DIR="$SHARED_DIR/backups"
          cd "$APP_DIR"
          test -f "$SHARED_DIR/.env"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"

          php artisan config:clear
          MIGRATION_STATUS="$(php artisan migrate:status --no-ansi)"
          printf '%s\n' "$MIGRATION_STATUS"
          EXPECTED="2026_11_23_000001_create_whatsapp_knowledge_table"
          PENDING="$(printf '%s\n' "$MIGRATION_STATUS" | grep 'Pending' || true)"
          if [ "$(printf '%s\n' "$PENDING" | grep -c 'Pending' || true)" -ne 1 ] || ! printf '%s\n' "$PENDING" | grep -F "$EXPECTED" >/dev/null; then
            echo "Safety stop: the only pending migration must be $EXPECTED."
            exit 1
          fi

          MYSQL_CNF="$BACKUP_DIR/.mysql-client-$$.cnf"
          TEST_DB=""
          cleanup() {
            if [ -n "$TEST_DB" ]; then
              mysql --defaults-extra-file="$MYSQL_CNF" -e "DROP DATABASE IF EXISTS \`$TEST_DB\`" >/dev/null 2>&1 || true
            fi
            rm -f "$MYSQL_CNF"
          }
          trap cleanup EXIT

          MYSQL_CNF_PATH="$MYSQL_CNF" php -r '
            require "vendor/autoload.php";
            Dotenv\Dotenv::createImmutable("/var/www/unigo/backend/shared")->safeLoad();
            $get = fn($k) => (string)($_ENV[$k] ?? $_SERVER[$k] ?? getenv($k) ?: "");
            $driver = strtolower($get("DB_CONNECTION"));
            if (!in_array($driver, ["mysql", "mariadb"], true)) { fwrite(STDERR, "Unsupported DB driver.\n"); exit(1); }
            $db = $get("DB_DATABASE"); $user = $get("DB_USERNAME");
            if ($db === "" || $user === "" || !preg_match("/^[A-Za-z0-9_]+$/", $db)) { fwrite(STDERR, "Invalid DB settings.\n"); exit(1); }
            $escape = fn($v) => str_replace(["\\", "\""], ["\\\\", "\\\""], $v);
            $cnf = "[client]\nhost=\"" . $escape($get("DB_HOST") ?: "127.0.0.1") . "\"\nport=" . (int)($get("DB_PORT") ?: 3306) . "\nuser=\"" . $escape($user) . "\"\npassword=\"" . $escape($get("DB_PASSWORD")) . "\"\n";
            file_put_contents(getenv("MYSQL_CNF_PATH"), $cnf, LOCK_EX); chmod(getenv("MYSQL_CNF_PATH"), 0600);
            echo $db;
          ' > "$BACKUP_DIR/.production-db-name-$$"
          PROD_DB="$(cat "$BACKUP_DIR/.production-db-name-$$")"
          rm -f "$BACKUP_DIR/.production-db-name-$$"
          mysql --defaults-extra-file="$MYSQL_CNF" -Nse 'SELECT 1' >/dev/null

          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$BACKUP_DIR/unigo-production-$TS.sql.gz"
          mysqldump --defaults-extra-file="$MYSQL_CNF" --single-transaction --quick --routines --triggers --events "$PROD_DB" | gzip -9 > "$BACKUP"
          chmod 600 "$BACKUP"
          test -s "$BACKUP"
          gzip -t "$BACKUP"
          sha256sum "$BACKUP" | tee "$BACKUP.sha256"
          chmod 600 "$BACKUP.sha256"
          echo "Backup verified: $BACKUP"

          TEST_DB="unigo_restore_test_$TS"
          mysql --defaults-extra-file="$MYSQL_CNF" -e "CREATE DATABASE \`$TEST_DB\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          gzip -dc "$BACKUP" | mysql --defaults-extra-file="$MYSQL_CNF" "$TEST_DB"
          RESTORED_TABLES="$(mysql --defaults-extra-file="$MYSQL_CNF" "$TEST_DB" -Nse 'SHOW TABLES' | wc -l)"
          test "$RESTORED_TABLES" -gt 0
          RESTORED_MIGRATIONS="$(mysql --defaults-extra-file="$MYSQL_CNF" "$TEST_DB" -Nse 'SELECT COUNT(*) FROM migrations')"
          test "$RESTORED_MIGRATIONS" -gt 0
          echo "Restore test passed: $RESTORED_TABLES tables restored; migration history readable."

          php artisan config:clear
          DB_DATABASE="$TEST_DB" php artisan migrate --force
          TEST_STATUS="$(DB_DATABASE="$TEST_DB" php artisan migrate:status --no-ansi)"
          printf '%s\n' "$TEST_STATUS"
          printf '%s\n' "$TEST_STATUS" | grep -F "$EXPECTED" | grep -F 'Ran' >/dev/null
          mysql --defaults-extra-file="$MYSQL_CNF" "$TEST_DB" -Nse "SHOW TABLES LIKE 'whatsapp_knowledge'" | grep -F whatsapp_knowledge >/dev/null
          echo "Isolated restore-and-migration test passed."

          php artisan config:clear
          php artisan migrate --force
          PROD_STATUS="$(php artisan migrate:status --no-ansi)"
          printf '%s\n' "$PROD_STATUS"
          printf '%s\n' "$PROD_STATUS" | grep -F "$EXPECTED" | grep -F 'Ran' >/dev/null
          mysql --defaults-extra-file="$MYSQL_CNF" "$PROD_DB" -Nse "SHOW TABLES LIKE 'whatsapp_knowledge'" | grep -F whatsapp_knowledge >/dev/null
          echo "Production migration verified."

          php artisan route:clear
          php artisan config:cache
          if [ -d "$APP_DIR/resources/views" ]; then
            php artisan view:clear
            php artisan view:cache
          fi
          mysql --defaults-extra-file="$MYSQL_CNF" -e "DROP DATABASE \`$TEST_DB\`"
          TEST_DB=""
          rm -f "$MYSQL_CNF"
          trap - EXIT
          echo "Migration completed. Backup retained at $BACKUP"
          REMOTE

      - name: Verify production API responds
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          url = "https://api.unigo-bd.com/api/countries"
          request = Request(url, headers={"Accept": "application/json", "User-Agent": "UniGo-Migration-Health-Check/1.0"})
          with urlopen(request, timeout=45) as response:
              if response.status != 200:
                  raise SystemExit(f"API health check failed: HTTP {response.status}")
              print(f"API health check passed: HTTP {response.status}")
          PY
