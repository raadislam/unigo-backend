name: Prepare and validate PDF dependencies

on:
  push:
    branches:
      - feature/server-side-visa-checklist-pdf
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/pdf-dependency-bootstrap.yml'
      - 'app/Services/VisaChecklistPdfService.php'
      - 'app/Http/Controllers/Api/VisaChecklistPdfController.php'
      - 'routes/api.php'
      - 'tests/Unit/VisaChecklistPdfServiceTest.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unigo-pdf-dependencies
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-side-visa-checklist-pdf
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Resolve and lock approved PDF dependencies
        run: composer update setasign/fpdi tecnickcom/tcpdf --with-all-dependencies --prefer-dist --no-interaction
      - name: Validate Composer manifests
        run: composer validate --strict
      - name: Install from the generated lock file
        run: composer install --prefer-dist --no-interaction
      - name: Verify PHP syntax
        run: |
          php -l app/Services/VisaChecklistPdfService.php
          php -l app/Http/Controllers/Api/VisaChecklistPdfController.php
          php -l routes/api.php
          php -l tests/Unit/VisaChecklistPdfServiceTest.php
      - name: Run automated PDF tests
        run: composer test
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - name: Verify PDF libraries
        run: |
          php -r "require 'vendor/autoload.php'; new setasign\Fpdi\Tcpdf\Fpdi(); echo 'FPDI/TCPDF autoload OK'.PHP_EOL;"
      - name: Commit generated lock file
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "build: lock FPDI and TCPDF PDF dependencies"
            git push origin feature/server-side-visa-checklist-pdf
          fi
