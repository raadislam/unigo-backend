name: Read-only Production Visa Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/read-only-production-visa-audit.yml'
      - 'scripts/validate_production_visa_audit.py'
      - 'scripts/batch46_database_guard.php'
      - 'app/Console/Commands/VisaRequirementAuditCommand.php'
      - 'database/data/country_discovery_ledger.csv'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/read-only-production-visa-audit.yml'
      - 'scripts/validate_production_visa_audit.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: unigo-read-only-production-visa-audit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend audit definitions
        uses: actions/checkout@v4
      - name: Validate audit script and workflow syntax
        run: |
          python3 -m py_compile scripts/validate_production_visa_audit.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0)); puts "Workflow YAML syntax OK"' .github/workflows/read-only-production-visa-audit.yml

  audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout backend audit definitions
        uses: actions/checkout@v4

      - name: Prepare read-only VPS SSH with pinned host-key verification
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is missing}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS secret is missing}"
          : "${VPS_HOST:?VPS_HOST secret is missing}"
          : "${VPS_PORT:?VPS_PORT secret is missing}"
          : "${VPS_USER:?VPS_USER secret is missing}"
          install -m 700 -d ~/.ssh
          printf '%s\\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_audit
          chmod 600 ~/.ssh/unigo_audit
          printf '%s\\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/pinned_known_hosts
          chmod 600 ~/.ssh/pinned_known_hosts
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/scanned_known_hosts 2>~/.ssh/audit-keyscan.log
          test -s ~/.ssh/scanned_known_hosts
          awk 'NF >= 3 && $1 !~ /^#/ { if ($1 ~ /^@/) print $3 " " $4; else print $2 " " $3 }' ~/.ssh/pinned_known_hosts | sort -u > ~/.ssh/pinned_keys
          awk 'NF >= 3 && $1 !~ /^#/ { print $2 " " $3 }' ~/.ssh/scanned_known_hosts | sort -u > ~/.ssh/scanned_keys
          if ! grep -Fxf ~/.ssh/pinned_keys ~/.ssh/scanned_keys >/dev/null; then
            echo "The VPS host key does not match VPS_KNOWN_HOSTS. Audit is blocked pending out-of-band fingerprint verification."
            exit 1
          fi
          awk 'NR == FNR { pinned[$0] = 1; next } (($2 " " $3) in pinned) { print }' ~/.ssh/pinned_keys ~/.ssh/scanned_known_hosts > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Export read-only production database snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_audit -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php artisan visa:requirements-audit' > production-visa-audit.json
          test -s production-visa-audit.json

      - name: Verify Ascension Island master-row identity and unpublished state after batch 46
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_audit -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php scripts/batch46_database_guard.php readback'
      - name: Print non-sensitive production directory parity diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("production-visa-audit.json").read_text(encoding="utf-8"))
          records = data.get("records") or []
          countries = data.get("country_table") or []
          public = data.get("public_country_directory") or []
          published = [
              row for row in records
              if row.get("passport_nationality_iso3") == "BGD"
              and row.get("travel_purpose") == "tourism"
              and row.get("verification_status") == "verified"
              and row.get("is_published") is True
          ]
          print("PRODUCTION_AUDIT_COUNTS " + json.dumps({
              "total_records": data.get("total"),
              "published_count": data.get("published_count"),
              "public_country_directory_count": data.get("public_country_directory_count"),
              "country_table_count": data.get("country_table_count"),
              "country_table_published_count": data.get("country_table_published_count"),
              "bgd_tourism_records": sum(1 for row in records if row.get("passport_nationality_iso3") == "BGD" and row.get("travel_purpose") == "tourism"),
              "active_published_bgd_tourism_candidates": len(published),
          }, ensure_ascii=False))
          print("PUBLIC_DIRECTORY_ISO2 " + json.dumps(sorted(str(row.get("iso2") or "").upper() for row in public)))
          print("COUNTRY_FLAG_PUBLISHED_ISO2 " + json.dumps(sorted(str(row.get("iso2") or "").upper() for row in countries if row.get("is_published") is True)))
          print("PUBLISHED_BGD_ISO2 " + json.dumps(sorted(str((row.get("country") or {}).get("iso2") or "").upper() for row in published)))
          from datetime import date
          today = date.today().isoformat()
          inactive_published = []
          for row in published:
              start = str(row.get("effective_from") or "")[:10]
              end = str(row.get("effective_until") or "")[:10]
              active = (not start or start <= today) and (not end or end >= today)
              if not active:
                  inactive_published.append({
                      "iso2": str((row.get("country") or {}).get("iso2") or "").upper(),
                      "id": row.get("id"),
                      "effective_from": row.get("effective_from"),
                      "effective_until": row.get("effective_until"),
                      "verification_status": row.get("verification_status"),
                      "is_published": row.get("is_published"),
                  })
          print("INACTIVE_PUBLISHED_BGD_RECORDS " + json.dumps(inactive_published, ensure_ascii=False))
          print("PENDING_BGD_ISO2 " + json.dumps(sorted(
              str((row.get("country") or {}).get("iso2") or "").upper()
              for row in records
              if row.get("passport_nationality_iso3") == "BGD"
              and row.get("travel_purpose") == "tourism"
              and (row.get("verification_status") != "verified" or row.get("is_published") is not True
                   or (row.get("effective_from") and str(row.get("effective_from"))[:10] > today)
                   or (row.get("effective_until") and str(row.get("effective_until"))[:10] < today))
              and (row.get("country") or {}).get("iso2")
          )))
          pending_records = [
              row for row in records
              if row.get("passport_nationality_iso3") == "BGD"
              and row.get("travel_purpose") == "tourism"
              and (row.get("verification_status") != "verified" or row.get("is_published") is not True
                   or (row.get("effective_from") and str(row.get("effective_from"))[:10] > today)
                   or (row.get("effective_until") and str(row.get("effective_until"))[:10] < today))
          ]
          print("PENDING_BGD_RECORDS " + json.dumps([
              {
                  "id": row.get("id"),
                  "country_id": row.get("country", {}).get("id") if row.get("country") else None,
                  "iso2": row.get("country", {}).get("iso2") if row.get("country") else None,
                  "verification_status": row.get("verification_status"),
                  "is_published": row.get("is_published"),
                  "effective_from": row.get("effective_from"),
                  "effective_until": row.get("effective_until"),
                  "source_count": len(row.get("sources") or []),
                  "primary_source_urls": [source.get("source_url") for source in (row.get("sources") or []) if source.get("is_primary")],
              }
              for row in pending_records
          ], ensure_ascii=False))
          print("ORPHAN_BGD_TOURISM_RECORDS " + json.dumps([
              {"id": row.get("id"), "country_id": None, "verification_status": row.get("verification_status"), "is_published": row.get("is_published")}
              for row in pending_records if not row.get("country")
          ], ensure_ascii=False))
          PY

      - name: Audit applicant checklist coverage without changing production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          cat > applicant-checklist-audit.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $records = \App\Models\VisaRequirement::query()
              ->with('country:id,name,iso2')
              ->where('passport_nationality_iso3', 'BGD')
              ->where('travel_purpose', 'tourism')
              ->get();
          $published = $records->filter(fn ($row) => $row->verification_status === 'verified' && (bool) $row->is_published);
          $withChecklist = $published->filter(fn ($row) => is_array($row->applicant_checklists) && count($row->applicant_checklists) > 0);
          $complete = $withChecklist->filter(function ($row) {
              $types = [];
              foreach ($row->applicant_checklists as $checklist) {
                  if (! is_array($checklist) || empty($checklist['applicant_type']) || ! is_array($checklist['documents'] ?? null) || count($checklist['documents']) === 0) return false;
                  $types[] = $checklist['applicant_type'];
                  foreach ($checklist['documents'] as $document) {
                      if (! is_array($document) || empty($document['name']) || ! in_array($document['status'] ?? '', ['required', 'conditional', 'if_applicable'], true)) return false;
                  }
              }
              return count(array_diff(['employee', 'self_employed_or_business_owner', 'student', 'retired'], $types)) === 0;
          });
          $missing = $published->diff($withChecklist)->map(fn ($row) => $row->country?->iso2)->filter()->values()->all();
          $incomplete = $withChecklist->diff($complete)->map(fn ($row) => $row->country?->iso2)->filter()->values()->all();
          echo json_encode([
              'total_bgd_tourism_records' => $records->count(),
              'published_count' => $published->count(),
              'published_with_checklists' => $withChecklist->count(),
              'published_with_complete_four_type_checklists' => $complete->count(),
              'published_missing_checklists' => count($missing),
              'published_incomplete_checklists' => count($incomplete),
              'missing_country_iso2' => $missing,
              'incomplete_country_iso2' => $incomplete,
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
          PHP
          scp -i ~/.ssh/unigo_audit -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes applicant-checklist-audit.php "$VPS_USER@$VPS_HOST:/tmp/unigo-applicant-checklist-audit.php"
          ssh -i ~/.ssh/unigo_audit -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php -l /tmp/unigo-applicant-checklist-audit.php >/dev/null && php /tmp/unigo-applicant-checklist-audit.php; status=$?; rm -f /tmp/unigo-applicant-checklist-audit.php; exit $status' > applicant-checklist-audit.json
          python3 -m json.tool applicant-checklist-audit.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("applicant-checklist-audit.json").read_text(encoding="utf-8"))
          print("APPLICANT_CHECKLIST_AUDIT " + json.dumps(data, ensure_ascii=False))
          PY

      - name: Read recent import results and failed-batch diagnostics without changing production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          host = __import__("os").environ["VPS_HOST"]
          port = __import__("os").environ["VPS_PORT"]
          user = __import__("os").environ["VPS_USER"]
          key = str(Path.home() / ".ssh" / "unigo_audit")
          root = "/var/www/unigo/backend/shared/imports"
          import re

          def scrub(value):
              if isinstance(value, dict):
                  return {
                      key: "[REDACTED]" if any(word in key.lower() for word in ("password", "token", "secret", "authorization")) else scrub(item)
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [scrub(item) for item in value]
              if isinstance(value, str):
                  return re.sub(r"(?i)\\b(password|token|secret|authorization)\\b(\\s*[:=]\\s*)[^\\s,;]+", r"\\1\\2[REDACTED]", value)
              return value

          names = (
              "batches_21_23_import_result.json",
              "batches_21_23_post_import_audit.json",
              "batch28_import_result.json",
              "batch28_post_import_audit.json",
              "batch29_import_result.json",
              "batch29_unpublish_result.json",
              "batch29_post_import_audit.json",
              "batch37-import-result.json",
              "batch37-readback.json",
              "/tmp/batch37-import-result.json",
              "/tmp/batch37-readback.json",
              "/tmp/batch38-import-result.json",
              "/tmp/batch38-readback.json",
              "/tmp/batch38-unpublish-result.json",
          )
          for name in names:
              remote = name if name.startswith("/") else f"{root}/{name}"
              try:
                  result = subprocess.run(
                      ["ssh", "-i", key, "-p", port, "-o", "BatchMode=yes", "-o", "ConnectTimeout=10", "-o", "StrictHostKeyChecking=yes", f"{user}@{host}", f"cat {remote}"],
                      text=True, capture_output=True, check=False, timeout=25
                  )
              except subprocess.TimeoutExpired:
                  print(f"{name}: TIMEOUT")
                  continue
              if result.returncode != 0:
                  print(f"{name}: MISSING_OR_UNREADABLE")
                  continue
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  print(f"{name}: NON_JSON_OUTPUT {scrub(result.stdout[:1000])}")
                  continue
              payload = scrub(payload)
              if "import_result" in name or "import-result" in name:
                  keys = ("csv_sha256", "mode", "rows", "created", "updated", "sources_added", "reverified", "republished", "read_back", "failures", "errors", "message")
                  print(json.dumps({"file": name, **{k: payload.get(k) for k in keys}}, indent=2, ensure_ascii=False))
              elif "unpublish" in name:
                  keys = ("mode", "csv_sha256", "rows", "unpublished", "read_back", "failures")
                  print(json.dumps({"file": name, **{k: payload.get(k) for k in keys}}, indent=2, ensure_ascii=False))
              elif "readback" in name:
                  print(json.dumps({"file": name, "payload": payload}, indent=2, ensure_ascii=False))
              else:
                  keys = ("total", "published_count", "pending_count", "country_table_count", "public_country_directory_count", "warnings", "errors")
                  print(json.dumps({"file": name, **{k: payload.get(k) for k in keys}}, indent=2, ensure_ascii=False))
          PY

      - name: Validate live database counts and discovery-master parity
        run: |
          python3 scripts/validate_production_visa_audit.py --audit-file production-visa-audit.json --ledger-file database/data/country_discovery_ledger.csv
