name: Read-only Production Visa Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/read-only-production-visa-audit.yml'
      - 'scripts/validate_production_visa_audit.py'
      - 'app/Console/Commands/VisaRequirementAuditCommand.php'
      - 'database/data/country_discovery_ledger.csv'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/read-only-production-visa-audit.yml'
      - 'scripts/validate_production_visa_audit.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: unigo-read-only-production-visa-audit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend audit definitions
        uses: actions/checkout@v4
      - name: Validate audit script and workflow syntax
        run: |
          python3 -m py_compile scripts/validate_production_visa_audit.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0)); puts "Workflow YAML syntax OK"' .github/workflows/read-only-production-visa-audit.yml

  audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout backend audit definitions
        uses: actions/checkout@v4

      - name: Prepare read-only VPS SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/unigo_audit
          chmod 600 ~/.ssh/unigo_audit
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>~/.ssh/audit-keyscan.log; then
              if [ -s ~/.ssh/known_hosts ]; then
                chmod 600 ~/.ssh/known_hosts
                exit 0
              fi
            fi
            echo "Read-only audit SSH host-key scan attempt $attempt failed."
            cat ~/.ssh/audit-keyscan.log
            sleep 5
          done
          echo "Unable to retrieve the VPS SSH host key for the read-only audit."
          exit 1

      - name: Export read-only production database snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/unigo_audit -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php artisan visa:requirements-audit' > production-visa-audit.json
          test -s production-visa-audit.json

      - name: Audit applicant checklist coverage without changing production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          cat > applicant-checklist-audit.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $records = \App\Models\VisaRequirement::query()
              ->with('country:id,name,iso2')
              ->where('passport_nationality_iso3', 'BGD')
              ->where('travel_purpose', 'tourism')
              ->get();
          $published = $records->filter(fn ($row) => $row->verification_status === 'verified' && (bool) $row->is_published);
          $withChecklist = $published->filter(fn ($row) => is_array($row->applicant_checklists) && count($row->applicant_checklists) > 0);
          $complete = $withChecklist->filter(function ($row) {
              $types = [];
              foreach ($row->applicant_checklists as $checklist) {
                  if (! is_array($checklist) || empty($checklist['applicant_type']) || ! is_array($checklist['documents'] ?? null) || count($checklist['documents']) === 0) return false;
                  $types[] = $checklist['applicant_type'];
                  foreach ($checklist['documents'] as $document) {
                      if (! is_array($document) || empty($document['name']) || ! in_array($document['status'] ?? '', ['required', 'conditional', 'if_applicable'], true)) return false;
                  }
              }
              return count(array_diff(['employee', 'self_employed_or_business_owner', 'student', 'retired'], $types)) === 0;
          });
          $missing = $published->diff($withChecklist)->map(fn ($row) => $row->country?->iso2)->filter()->values()->all();
          $incomplete = $withChecklist->diff($complete)->map(fn ($row) => $row->country?->iso2)->filter()->values()->all();
          echo json_encode([
              'total_bgd_tourism_records' => $records->count(),
              'published_count' => $published->count(),
              'published_with_checklists' => $withChecklist->count(),
              'published_with_complete_four_type_checklists' => $complete->count(),
              'published_missing_checklists' => count($missing),
              'published_incomplete_checklists' => count($incomplete),
              'missing_country_iso2' => $missing,
              'incomplete_country_iso2' => $incomplete,
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
          PHP
          scp -i ~/.ssh/unigo_audit -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes applicant-checklist-audit.php "$VPS_USER@$VPS_HOST:/tmp/unigo-applicant-checklist-audit.php"
          ssh -i ~/.ssh/unigo_audit -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /var/www/unigo/backend/current && php -l /tmp/unigo-applicant-checklist-audit.php >/dev/null && php /tmp/unigo-applicant-checklist-audit.php; status=$?; rm -f /tmp/unigo-applicant-checklist-audit.php; exit $status' > applicant-checklist-audit.json
          python3 -m json.tool applicant-checklist-audit.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("applicant-checklist-audit.json").read_text(encoding="utf-8"))
          print("APPLICANT_CHECKLIST_AUDIT " + json.dumps(data, ensure_ascii=False))
          PY

      - name: Read latest batch 21-23 import result without changing production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          host = __import__("os").environ["VPS_HOST"]
          port = __import__("os").environ["VPS_PORT"]
          user = __import__("os").environ["VPS_USER"]
          key = str(Path.home() / ".ssh" / "unigo_audit")
          root = "/var/www/unigo/backend/shared/imports"
          import re

          def scrub(value):
              if isinstance(value, dict):
                  return {
                      key: "[REDACTED]" if any(word in key.lower() for word in ("password", "token", "secret", "authorization")) else scrub(item)
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [scrub(item) for item in value]
              if isinstance(value, str):
                  return re.sub(r"(?i)\\b(password|token|secret|authorization)\\b(\\s*[:=]\\s*)[^\\s,;]+", r"\\1\\2[REDACTED]", value)
              return value

          names = (
              "batches_21_23_import_result.json",
              "batches_21_23_post_import_audit.json",
              "batch28_import_result.json",
              "batch28_post_import_audit.json",
              "batch29_import_result.json",
              "batch29_unpublish_result.json",
              "batch29_post_import_audit.json",
          )
          for name in names:
              remote = f"{root}/{name}"
              try:
                  result = subprocess.run(
                      ["ssh", "-i", key, "-p", port, "-o", "BatchMode=yes", "-o", "ConnectTimeout=10", "-o", "StrictHostKeyChecking=yes", f"{user}@{host}", f"cat {remote}"],
                      text=True, capture_output=True, check=False, timeout=25
                  )
              except subprocess.TimeoutExpired:
                  print(f"{name}: TIMEOUT")
                  continue
              if result.returncode != 0:
                  print(f"{name}: MISSING_OR_UNREADABLE")
                  continue
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  print(f"{name}: NON_JSON_OUTPUT {scrub(result.stdout[:1000])}")
                  continue
              payload = scrub(payload)
              if name.endswith("import_result.json"):
                  keys = ("csv_sha256", "mode", "rows", "updated", "sources_added", "reverified", "republished", "read_back", "failures", "errors", "message")
                  print(json.dumps({"file": name, **{k: payload.get(k) for k in keys}}, indent=2, ensure_ascii=False))
              else:
                  keys = ("total", "published_count", "pending_count", "country_table_count", "public_country_directory_count", "warnings", "errors")
                  print(json.dumps({"file": name, **{k: payload.get(k) for k in keys}}, indent=2, ensure_ascii=False))
          PY

      - name: Validate live database counts and discovery-master parity
        run: |
          python3 scripts/validate_production_visa_audit.py --audit-file production-visa-audit.json --ledger-file database/data/country_discovery_ledger.csv
